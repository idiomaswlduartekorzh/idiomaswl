<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Larkspur Repair House lettered floor plan</title>
  <desc id="description">North-up rectangular floor plan. The entrance is centred on the south wall, a courtyard is in the centre, toilets are at the upper left, and an emergency exit is on the upper-right wall. Eight possible areas are labelled A through H.</desc>
  <defs>
    <style>
      .wall { fill: #f7fafb; stroke: #17324d; stroke-width: 5; }
      .room { fill: #ffffff; stroke: #486173; stroke-width: 3; }
      .fixed { fill: #e6f0f2; stroke: #486173; stroke-width: 3; }
      .court { fill: #d9eee7; stroke: #357568; stroke-width: 4; }
      .letter { fill: #a72d3d; font: 800 34px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .label { fill: #17324d; font: 700 22px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #486173; font: 650 18px system-ui, sans-serif; text-anchor: middle; }
      .north { fill: #17324d; font: 800 20px system-ui, sans-serif; text-anchor: middle; }
      .path { fill: none; stroke: #aec0ca; stroke-width: 14; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="wall" x="20" y="20" width="960" height="600" rx="8" />
  <path class="path" d="M500 590V445M500 445H690M500 445H310M310 445V185M690 445V185M310 185H690" />

  <rect class="fixed" x="40" y="45" width="160" height="95" rx="5" />
  <text class="label" x="120" y="88">Toilets</text>
  <text class="small" x="120" y="115">fixed landmark</text>

  <rect class="room" data-option-key="A" x="225" y="45" width="170" height="95" rx="5" />
  <text class="letter" x="310" y="92">A</text>
  <rect class="room" data-option-key="B" x="420" y="45" width="170" height="95" rx="5" />
  <text class="letter" x="505" y="92">B</text>
  <rect class="room" data-option-key="C" x="615" y="45" width="280" height="95" rx="5" />
  <text class="letter" x="755" y="92">C</text>

  <rect class="room" data-option-key="D" x="40" y="225" width="230" height="185" rx="5" />
  <text class="letter" x="155" y="318">D</text>
  <rect class="court" x="350" y="225" width="300" height="185" rx="5" />
  <text class="label" x="500" y="310">Courtyard</text>
  <text class="small" x="500" y="340">fixed landmark</text>
  <rect class="room" data-option-key="E" x="730" y="225" width="230" height="185" rx="5" />
  <text class="letter" x="845" y="318">E</text>

  <rect class="room" data-option-key="F" x="40" y="455" width="220" height="115" rx="5" />
  <text class="letter" x="150" y="513">F</text>
  <rect class="room" data-option-key="G" x="285" y="455" width="135" height="115" rx="5" />
  <text class="letter" x="352" y="513">G</text>
  <rect class="room" data-option-key="H" x="580" y="455" width="220" height="115" rx="5" />
  <text class="letter" x="690" y="513">H</text>

  <rect class="fixed" x="430" y="585" width="140" height="45" rx="4" />
  <text class="label" x="500" y="614">Entrance</text>

  <line x1="975" y1="65" x2="975" y2="135" stroke="#a72d3d" stroke-width="9" />
  <text class="small" x="878" y="168">Emergency Exit</text>

  <path d="M920 525V478" stroke="#17324d" stroke-width="4" />
  <path d="M908 490L920 474L932 490" fill="none" stroke="#17324d" stroke-width="4" />
  <text class="north" x="920" y="548">N</text>
</svg>
