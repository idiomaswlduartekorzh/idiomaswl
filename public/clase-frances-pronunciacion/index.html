<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le français n'est pas ce qu'il paraît</title>
  <style>
    :root {
      --cream: #f7f0e2;
      --paper: #fffaf0;
      --ink: #10233f;
      --muted: #69758a;
      --blue: #173f7a;
      --blue-soft: #dce8f8;
      --red: #b33a3a;
      --gold: #c79a35;
      --green: #28795f;
      --violet: #7353a6;
      --sky: #3d7f9f;
      --rose: #c45b75;
      --line: rgba(16, 35, 63, .16);
      --shadow: 0 22px 60px rgba(16, 35, 63, .12);
      --radius: 8px;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: Avenir, "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-ui: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --text-scale: 1;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23,63,122,.045) 1px, transparent 1px),
        linear-gradient(rgba(23,63,122,.035) 1px, transparent 1px),
        var(--cream);
      background-size: 42px 42px;
      font-family: var(--font-body);
    }

    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      min-height: 42px;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(16,35,63,.1); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(199,154,53,.45);
      outline-offset: 2px;
    }
    button[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px clamp(14px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: rgba(247,240,226,.92);
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .seal {
      width: 38px;
      height: 38px;
      border: 1px solid var(--ink);
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-family: var(--font-display);
      color: var(--red);
      flex: 0 0 auto;
    }
    .brand strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand span { display: block; color: var(--muted); font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .icon-btn { width: 42px; padding: 0; display: inline-grid; place-items: center; }
    .primary { background: var(--blue); color: white; border-color: var(--blue); padding: 0 18px; }
    .danger { color: var(--red); border-color: rgba(179,58,58,.35); }
    .ghost { background: transparent; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,250,240,.72);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: calc(100vh - 60px);
    }
    .rail {
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      background: rgba(255,250,240,.48);
    }
    .steps { display: grid; gap: 7px; }
    .step {
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: center;
      padding: 9px;
      background: transparent;
    }
    .step .num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid var(--line);
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .step.active { background: var(--blue); color: white; border-color: var(--blue); }
    .step.active .num { border-color: rgba(255,255,255,.38); color: white; }
    .step.done .num { background: var(--green); color: white; border-color: var(--green); }
    .stage {
      min-width: 0;
      padding: clamp(18px, 4vw, 46px);
    }
    .screen {
      display: none;
      max-width: 1180px;
      margin: 0 auto;
      animation: enter .24s ease;
    }
    .screen.active { display: block; }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }

    .hero {
      min-height: calc(100vh - 150px);
      display: grid;
      align-content: center;
      gap: 28px;
    }
    h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: 0; }
    h1 {
      max-width: 980px;
      font-family: var(--font-display);
      font-size: clamp(46px, 9vw, 108px);
      font-weight: 700;
    }
    h2 {
      font-family: var(--font-display);
      font-size: clamp(34px, 5vw, 64px);
      margin-bottom: 12px;
    }
    h3 { font-size: 22px; margin-bottom: 8px; }
    p { line-height: 1.55; }
    .lead { max-width: 680px; font-size: clamp(19px, 2vw, 25px); color: #33445f; }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 34px;
      align-items: end;
    }
    .decoder {
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 14px;
      align-content: center;
    }
    .code-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-display);
      font-size: 26px;
    }
    .code-line:last-child { border-bottom: 0; }
    .code-line span:last-child {
      font-family: var(--font-ui);
      color: var(--red);
      font-size: 16px;
    }
    .code-line b { animation: decode 4s ease-in-out infinite; }
    .code-line:nth-child(2) b { animation-delay: .5s; }
    .code-line:nth-child(3) b { animation-delay: 1s; }
    .code-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      object-fit: cover;
      background: var(--cream);
    }
    @keyframes decode {
      0%, 100% { color: var(--ink); letter-spacing: 0; }
      48%, 58% { color: var(--red); letter-spacing: 1px; }
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(255,250,240,.82);
      border-radius: var(--radius);
      box-shadow: 0 14px 36px rgba(16,35,63,.08);
      padding: clamp(16px, 2.4vw, 26px);
    }
    .grid { display: grid; gap: 16px; }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
    .small { color: var(--muted); font-size: 14px; }
    .teacher-note {
      display: none;
      margin: 12px 0;
      padding: 12px 14px;
      border-left: 4px solid var(--gold);
      background: rgba(199,154,53,.12);
      color: #604716;
    }
    body.show-spanish .teacher-note { display: block; }

    .central-text {
      font-family: var(--font-display);
      font-size: calc(clamp(24px, 3vw, 42px) * var(--text-scale));
      line-height: 1.55;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(18px, 3vw, 34px);
      box-shadow: var(--shadow);
    }
    .central-text.hidden-text { filter: blur(9px); user-select: none; }
    .word {
      border-radius: 5px;
      padding: 0 2px;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, opacity .15s ease;
    }
    .word.recognized { background: rgba(40,121,95,.18); box-shadow: inset 0 -2px 0 var(--green); }
    .word.active-sentence { background: rgba(199,154,53,.22); }
    .word.mark-silent { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
    .hl-ou { background: rgba(61,127,159,.22); }
    .hl-u { background: rgba(115,83,166,.2); }
    .hl-oi { background: rgba(179,58,58,.16); }
    .hl-au { background: rgba(199,154,53,.25); }
    .hl-ch { background: rgba(40,121,95,.18); }
    .hl-on { background: rgba(196,91,117,.18); }
    .hl-liaison { box-shadow: inset 0 -3px 0 var(--blue); }
    .rhythm { border-bottom: 2px dotted var(--gold); }

    .participant {
      display: grid;
      gap: 12px;
      border-left: 4px solid var(--blue);
    }
    .participant[data-person="Mère"] { border-left-color: var(--red); }
    .participant[data-person="Enfant"] { border-left-color: var(--green); }
    .rec-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    canvas.wave {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(23,63,122,.08), rgba(255,250,240,.6));
    }
    .recording { color: var(--red); font-weight: 700; }

    .question {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
    }
    .answers { display: flex; gap: 8px; flex-wrap: wrap; }
    .answer.correct { background: rgba(40,121,95,.15); border-color: var(--green); }
    .answer.wrong { background: rgba(179,58,58,.12); border-color: var(--red); }
    .visual-choice {
      min-width: 72px;
      padding: 8px 10px;
      display: inline-grid;
      place-items: center;
      gap: 4px;
    }
    .mini-visual {
      width: 38px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid currentColor;
      position: relative;
    }
    .mini-visual::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      right: 7px;
      top: 6px;
    }
    .asset-tile {
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(23,63,122,.08), rgba(179,58,58,.07)),
        var(--paper);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--muted);
      text-align: center;
      padding: 14px;
    }
    .asset-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .asset-tile img.missing { display: none; }

    .sentence-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .sentence-line.active { background: rgba(199,154,53,.12); }
    .sentence-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
    .sentence-actions button { min-height: 36px; padding: 0 10px; }

    .secret-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
    .secret-tabs button { flex: 0 0 auto; padding: 0 12px; }
    .secret-tabs button.active { background: var(--blue); color: white; border-color: var(--blue); }
    .cluster-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0 18px;
    }
    .cluster-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,250,240,.86);
      padding: 14px;
    }
    .cluster-card.active { border-color: var(--blue); box-shadow: inset 0 0 0 2px rgba(23,63,122,.16); }
    .cluster-card h3 { font-size: 18px; margin-bottom: 6px; }
    .cluster-card .sound-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }
    .sound-badge {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .cluster-rule-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cluster-rule-list button {
      min-height: 32px;
      padding: 4px 8px;
      font-size: 13px;
      text-align: left;
    }
    .cluster-rule-list button.active { background: var(--blue); color: white; border-color: var(--blue); }
    .rule-grid {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 18px;
      align-items: start;
    }
    .phase {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,250,240,.78);
    }
    .phase-label {
      display: inline-block;
      margin-bottom: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--blue);
      letter-spacing: .08em;
    }
    .pattern-word {
      font-family: var(--font-display);
      font-size: 32px;
      display: inline-block;
      margin: 5px 7px 5px 0;
    }
    .silent-end { opacity: .42; text-decoration: line-through; text-decoration-color: var(--red); }
    .lip {
      width: 120px;
      height: 72px;
      border: 3px solid var(--red);
      border-radius: 48% 52% 50% 50%;
      display: grid;
      place-items: center;
      margin: 12px 0;
      color: var(--red);
      animation: lips 2.8s ease-in-out infinite;
    }
    @keyframes lips {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(.72); }
    }
    .nasal {
      width: 150px;
      height: 86px;
      border: 2px solid var(--rose);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      margin: 12px 0;
    }
    .nasal::before, .nasal::after {
      content: "";
      position: absolute;
      height: 2px;
      width: 62px;
      background: var(--rose);
      right: -50px;
    }
    .nasal::before { top: 26px; transform: rotate(-12deg); }
    .nasal::after { bottom: 26px; transform: rotate(12deg); }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .word-chip { padding: 9px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
    .word-chip.selected { background: var(--blue-soft); border-color: var(--blue); }

    .dropzones { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
    .dropzone {
      min-height: 98px;
      padding: 10px;
      border: 1px dashed rgba(16,35,63,.35);
      border-radius: var(--radius);
      background: rgba(255,250,240,.55);
    }
    .dropzone strong { display: block; margin-bottom: 8px; }
    .dragging { opacity: .55; }
    .feedback { min-height: 28px; color: var(--green); font-weight: 700; margin-top: 8px; }

    .layer-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .layer-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
    }

    .group-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      font-size: 22px;
    }
    .countdown {
      font-family: var(--font-display);
      font-size: 58px;
      color: var(--red);
      min-height: 70px;
    }

    .checklist label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .template input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }
    .presentation {
      white-space: pre-line;
      font-family: var(--font-display);
      font-size: 30px;
      line-height: 1.55;
    }
    .progress-person {
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .bar {
      height: 9px;
      border-radius: 999px;
      background: rgba(16,35,63,.12);
      overflow: hidden;
    }
    .bar span { display: block; height: 100%; background: var(--green); width: 0; }

    .teacher-panel {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(430px, 100vw);
      z-index: 50;
      transform: translateX(105%);
      transition: transform .2s ease;
      background: #11233e;
      color: white;
      box-shadow: -28px 0 70px rgba(0,0,0,.24);
      padding: 18px;
      overflow-y: auto;
    }
    .teacher-panel.open { transform: translateX(0); }
    .teacher-panel button, .teacher-panel input, .teacher-panel select {
      background: rgba(255,255,255,.08);
      color: white;
      border-color: rgba(255,255,255,.22);
    }
    .teacher-panel input, .teacher-panel select { padding: 9px; border-radius: var(--radius); width: 100%; }
    .teacher-panel option { color: var(--ink); }
    .teacher-panel .panel { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); box-shadow: none; }

    .footer-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 22px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--ink);
      color: white;
      border-radius: var(--radius);
      padding: 12px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .toast.show { opacity: 1; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .rail { position: sticky; top: 59px; z-index: 12; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 10px; }
      .steps { display: flex; width: max-content; }
      .step { width: 190px; }
      .hero-grid, .two, .three, .four, .rule-grid { grid-template-columns: 1fr; }
      .dropzones { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cluster-map { grid-template-columns: 1fr; }
      .sentence-line, .question, .group-line { grid-template-columns: 1fr; }
      .sentence-actions { justify-content: flex-start; }
    }
    @media (max-width: 560px) {
      .topbar { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      .stage { padding: 14px; }
      h1 { font-size: 42px; }
      .central-text { font-size: calc(23px * var(--text-scale)); }
      .dropzones { grid-template-columns: 1fr; }
      .footer-nav { position: sticky; bottom: 0; background: rgba(247,240,226,.94); padding: 10px 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar" aria-label="Navigation principale">
      <div class="brand">
        <div class="seal" aria-hidden="true">fr</div>
        <div>
          <strong>Le français n'est pas ce qu'il paraît</strong>
          <span id="stageLabel">Bienvenue</span>
        </div>
      </div>
      <div class="controls">
        <button class="icon-btn ghost" id="prevTop" aria-label="Écran précédent">‹</button>
        <button class="icon-btn ghost" id="nextTop" aria-label="Écran suivant">›</button>
        <button class="icon-btn" id="teacherToggle" aria-label="Mode professeur">P</button>
        <button class="icon-btn danger" id="resetAll" aria-label="Réinitialiser la session">↺</button>
      </div>
    </header>

    <div class="layout">
      <aside class="rail" aria-label="Étapes de la classe">
        <nav class="steps" id="stepNav"></nav>
      </aside>
      <main class="stage" id="main" tabindex="-1"></main>
    </div>
  </div>

  <aside class="teacher-panel" id="teacherPanel" aria-label="Modo profesor" aria-hidden="true">
    <div class="toolbar" style="justify-content:space-between">
      <h3>Modo profesor</h3>
      <button id="closeTeacher" class="icon-btn" aria-label="Cerrar">×</button>
    </div>
    <p class="small" style="color:#cdd8ea">Pulsa P para abrir o cerrar este panel.</p>
    <div class="grid">
      <section class="panel">
        <label>Ir a pantalla
          <select id="teacherScreen"></select>
        </label>
        <div class="toolbar">
          <button id="toggleSpanish">Explicaciones en español</button>
          <button id="toggleMarks">Marcas</button>
        </div>
      </section>
      <section class="panel">
        <h3>Tiempo</h3>
        <p>Clase: <strong id="classTimer">00:00</strong></p>
        <p>Actividad: <strong id="activityTimer">00:00</strong></p>
        <div class="toolbar">
          <button id="startActivity">Iniciar cronómetro</button>
          <button id="stopActivity">Detener</button>
          <button id="resetActivity">Reiniciar</button>
        </div>

    function speak(text, rate = state.rate) {
      if (!("speechSynthesis" in window)) {
        showToast("Audio local non disponible.");
        return;
      }
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "fr-FR";
      utterance.rate = rate;
      utterance.volume = state.volume;
      speechSynthesis.speak(utterance);
    }

    function playAudio(path, fallbackText, rate = state.rate) {
      const audio = new Audio(path);
      audio.volume = state.volume;
      audio.playbackRate = rate;
      audio.addEventListener("error", () => {
        showToast("Audio introuvable. J'utilise la voix du navigateur.");
        speak(fallbackText, rate);
      }, { once: true });
      audio.play().catch(() => {
        showToast("Cliquez encore une fois pour autoriser l'audio.");
        speak(fallbackText, rate);
      });
    }

    function splitWords(text) {
      return text.match(/[\p{L}À-ÿ’'-]+|[.,!?;:]/gu) || [];
    }

    function renderCentralText(options = {}) {
      const { hidden = false, marked = false, activeSentence = -1, layers = [] } = options;
      let html = "";
      CONFIG.sentences.forEach((sentence, si) => {
        splitWords(sentence).forEach(token => {
          if (/^[.,!?;:]$/.test(token)) {
            html += token + " ";
            return;
          }
          const classes = ["word"];
          if (activeSentence === si) classes.push("active-sentence");
          if (marked || layers.includes("silent")) {
            if (/^(petit|Paris|français|bientôt)$/i.test(token)) classes.push("mark-silent");
          }
          const lower = token.toLowerCase();
          if (layers.includes("ou") && lower.includes("ou")) classes.push("hl-ou");
          if (layers.includes("u") && lower.includes("u") && !lower.includes("ou")) classes.push("hl-u");
          if (layers.includes("oi") && lower.includes("oi")) classes.push("hl-oi");
          if (layers.includes("au") && (lower.includes("au") || lower.includes("eau"))) classes.push("hl-au");
          if (layers.includes("aOpen") && /a|â/i.test(lower)) classes.push("hl-au");
          if (layers.includes("oFamily") && /o|ô|au|eau/i.test(lower)) classes.push("hl-ou");
          if (layers.includes("ch") && lower.includes("ch")) classes.push("hl-ch");
          if (layers.includes("on") && lower.includes("on")) classes.push("hl-on");
          if (layers.includes("eFinal") && /e$/i.test(lower)) classes.push("hl-au");
          if (layers.includes("accents") && /[éèê]/i.test(lower)) classes.push("hl-u");
          if (layers.includes("ai") && /ai|ei/i.test(lower)) classes.push("hl-oi");
          if (layers.includes("erEz") && /er$|ez$/i.test(lower)) classes.push("hl-u");
          if (layers.includes("etEsEst") && /^(et|est|es|les|des)$/i.test(lower)) classes.push("hl-au");
          if (layers.includes("an") && /an|en/i.test(lower)) classes.push("hl-on");
          if (layers.includes("in") && /in|ain|ein|ien/i.test(lower)) classes.push("hl-on");
          if (layers.includes("unUm") && /un|um/i.test(lower)) classes.push("hl-on");
          if (layers.includes("nasalM") && /(am|em|im|om)[pbm]?/i.test(lower)) classes.push("hl-on");
          if (layers.includes("eu") && /eu|œu/i.test(lower)) classes.push("hl-ou");
          if (layers.includes("iY") && /i|y/i.test(lower)) classes.push("hl-u");
          if (layers.includes("ill") && /ill/i.test(lower)) classes.push("hl-ch");
          if (layers.includes("qu") && /qu/i.test(lower)) classes.push("hl-au");
          if (layers.includes("cSoft") && /ç|ce|ci|cy/i.test(lower)) classes.push("hl-oi");
          if (layers.includes("cHard") && /c[aoûu]|^c/i.test(lower)) classes.push("hl-au");
          if (layers.includes("gSoft") && /ge|gi|gy/i.test(lower)) classes.push("hl-u");
          if (layers.includes("gHard") && /ga|go|gu|gue|gui/i.test(lower)) classes.push("hl-au");
          if (layers.includes("jFrench") && /j|ge|gi/i.test(lower)) classes.push("hl-u");
          if (layers.includes("bV") && /b|v/i.test(lower)) classes.push("hl-oi");
          if (layers.includes("rFrench") && /r/i.test(lower)) classes.push("hl-oi");
          if (layers.includes("sZ") && /s/i.test(lower)) classes.push("hl-ch");
          if (layers.includes("phThX") && /ph|th|x/i.test(lower)) classes.push("hl-u");
          if (layers.includes("hMuet") && /^h/i.test(lower)) classes.push("hl-liaison");
          if (layers.includes("ien") && /ien/i.test(lower)) classes.push("hl-on");
          if (layers.includes("elision") && /[jl]’|[jl]'/i.test(lower)) classes.push("hl-liaison");
          if (layers.includes("enchainement") && /avec|petit|nous/i.test(lower)) classes.push("hl-liaison");
          if (layers.includes("liaison") && (lower === "nous" || lower === "avons")) classes.push("hl-liaison");
          if (layers.includes("rhythm")) classes.push("rhythm");
          html += `<span class="${classes.join(" ")}" data-word="${token}">${token}</span> `;
        });
      });
      return `<div class="central-text ${hidden ? "hidden-text" : ""}" id="centralText" aria-label="Texte central">${html.trim()}</div>`;
    }

    function highlightPattern(word, rule) {
      if (rule.pattern === "finale") return word.replace(/([tsç])$/i, '<span class="silent-end">$1</span>');
      if (rule.pattern === "ent") return word.replace(/(ent)$/i, '<mark>$1</mark>');
      if (rule.pattern === "liaison") return word.replace(" ", "‿");
      const map = {
        ou: /(ou)/ig,
        u: /(u)/ig,
        oi: /(oi)/ig,
        au: /(eau|au)/ig,
        ch: /(ch)/ig,
        on: /(on)/ig,
        eFinal: /(e)$/ig,
        accents: /([éèê])/ig,
        ai: /(ai|ei)/ig,
        an: /(an|en)/ig,
        in: /(ain|ein|ien|in)/ig,
        eu: /(eu|œu)/ig,
        gn: /(gn)/ig,
        ill: /(ill|il)$/ig,
        qu: /(qu)/ig,
        cSoft: /(ç|ce|ci|cy)/ig,
        gSoft: /(ge|gi|gy)/ig,
        hMuet: /^(h)/ig,
        ien: /(ien)/ig,
        aOpen: /([aâ])/ig,
        oFamily: /(au|eau|o|ô)/ig,
        erEz: /(er|ez)$/ig,
        etEsEst: /^(et|es|est|les|des)$/ig,
        iY: /([iy])/ig,
        unUm: /(un|um)/ig,
        nasalM: /(am|em|im|om)/ig,
        nasalVowel: /(on|onne|un|une)/ig,
        rFrench: /(r)/ig,
        sZ: /(ss|s)/ig,
        cHard: /(c)/ig,
        gHard: /(gu|ge|g)/ig,
        jFrench: /(j|ge|gi)/ig,
        bV: /(b|v)/ig,
        phThX: /(ph|th|x)/ig,
        elision: /([jl]’|[jl]')/ig,
        enchainement: /(\bavec\b|\bil\b|\bpetit\b)/ig,
        rhythmAccent: /(.+)$/ig
      };
      return word.replace(map[rule.pattern] || /$a/, "<mark>$1</mark>");
    }

    function ruleDiscoveryVisual(rule) {
      const extras = [];
      if (rule.pattern === "ou") extras.push(assetTile(CONFIG.images.ou, "Position des lèvres pour OU"), '<div class="lip">lèvres</div>');
      if (rule.pattern === "u") extras.push(assetTile(CONFIG.images.u, "Position des lèvres pour U"), '<div class="lip">lèvres</div>');
      if (rule.pattern === "ch") extras.push('<div class="lip">chut</div>');
      if (rule.pattern === "on") extras.push(assetTile(CONFIG.images.nasal, "Son nasal ON"), '<div class="nasal">ON</div>');
      if (rule.pattern === "liaison") extras.push(assetTile(CONFIG.images.liaison, "Liaison nous avons"), '<p class="pattern-word">nous‿avons</p>');
      if (rule.image && CONFIG.images[rule.image]) extras.push(assetTile(CONFIG.images[rule.image], rule.title));
      return extras.join("");
    }

    function escapeRegExp(value) {

    function highlightRuleInText(text, rule) {
      const matches = rule.textMatches.concat(rule.words).filter(Boolean);
      if (!matches.length) return text;
      const pattern = matches.map(escapeRegExp).join("|");
      return text.replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>");
    }

    async function startRecording(key) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = event => chunks.push(event.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
          state.recordings[key] = URL.createObjectURL(blob);
          stream.getTracks().forEach(track => track.stop());
          state.progress[`rec-${key}`] = true;
          saveProgress();
          updateRecordingButtons();
          updateTeacherPanel();
          showToast("Voix enregistrée.");
        };
        state.media[key] = recorder;
        recorder.start();
        markRecordingState(key, true);
        animateWave(key);
      } catch (error) {
        showToast("Micro non disponible. Vérifiez les permissions.");
      }
    }

    function stopRecording(key) {
      const recorder = state.media[key];
      if (recorder && recorder.state !== "inactive") recorder.stop();
      markRecordingState(key, false);
    }

    function playRecording(key) {
      const url = state.recordings[key];
      if (!url) return showToast("Pas encore enregistré.");
      const audio = new Audio(url);
      audio.volume = state.volume;
      audio.play();
    }

    function markRecordingState(key, isRecording) {
      $$(`[data-record="${CSS.escape(key)}"]`).forEach(btn => btn.disabled = isRecording);
      $$(`[data-stop="${CSS.escape(key)}"]`).forEach(btn => btn.disabled = !isRecording);
      $$(`[data-rec-status="${CSS.escape(key)}"]`).forEach(el => {
        el.textContent = isRecording ? "Enregistrement..." : (state.recordings[key] ? "Voix disponible" : "Pas encore enregistré");
        el.classList.toggle("recording", isRecording);
      });
    }

    function updateRecordingButtons() {
      $$("[data-play-recording]").forEach(btn => btn.disabled = !state.recordings[btn.dataset.playRecording]);
      Object.keys(state.recordings).forEach(key => markRecordingState(key, false));
    }

    function animateWave(key) {
      const canvas = $(`[data-wave="${CSS.escape(key)}"]`);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(260, rect.width);
      canvas.height = 46;
      let frame = 0;
      function draw() {
        if (!state.media[key] || state.media[key].state !== "recording") return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#173f7a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 8) {
          const y = 23 + Math.sin((x + frame) * .06) * (8 + Math.sin(frame * .05) * 8);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        frame += 7;
        requestAnimationFrame(draw);
      }
      draw();
    }

    function runEcho(i) {
      const count = $("#countdown");
      speak(CONFIG.rhythmGroups[i].replaceAll("/", ""), .78);
      let n = 3;
      const timer = setInterval(() => {
        count.textContent = n ? String(n) : "Répétez";
        n -= 1;
        if (n < -1) {
          clearInterval(timer);
          count.textContent = "";
          showToast("À vous de répéter.");
        }
      }, 850);
    }

    function compareReadings(person) {
      const first = `${person}-first`;
      const second = `${person}-second`;
      if (!state.recordings[first] || !state.recordings[second]) return showToast("Il faut deux lectures.");
      const firstAudio = new Audio(state.recordings[first]);
      firstAudio.onended = () => new Audio(state.recordings[second]).play();
      firstAudio.play();
    }

    function updateTeacherPanel() {
      const select = $("#teacherScreen");
      if (!select) return;
      select.innerHTML = CONFIG.stages.map((s, i) => `<option value="${i}" ${i === state.screen ? "selected" : ""}>${i + 1}. ${s[0]}</option>`).join("");
      $("#teacherParticipants").innerHTML = CONFIG.participants.map(p => `
        <label>${p}
          <input data-name="${p}" value="${state.names[p] || p}">
        </label>
        <label>Difficulté
          <select data-difficulty="${p}">
            <option>support visible</option>
            <option>standard</option>
            <option>défi</option>
          </select>
        </label>
      `).join("");
      $("#recordingStatus").innerHTML = CONFIG.participants.map(p => `${state.names[p] || p}: première ${state.recordings[`${p}-first`] ? "oui" : "non"}, deuxième ${state.recordings[`${p}-second`] ? "oui" : "non"}`).join("<br>");
      $("#answerKey").innerHTML = CONFIG.questions.map(q => `${q.q} → ${q.correct}`).join("<br>");
      $$("[data-name]").forEach(input => input.addEventListener("change", () => {
        state.names[input.dataset.name] = input.value.trim() || input.dataset.name;
        saveProgress();
        render();
      }));
    }

    function toggleTeacher(force) {
      state.teacherOpen = typeof force === "boolean" ? force : !state.teacherOpen;
      $("#teacherPanel").classList.toggle("open", state.teacherOpen);
      $("#teacherPanel").setAttribute("aria-hidden", String(!state.teacherOpen));
    }

    function resetAll() {
      if (!confirm("Réinitialiser toute la session ?")) return;
      localStorage.removeItem("frPronProgress");
      localStorage.removeItem("frPronNames");
      localStorage.removeItem("frPronLayers");
      localStorage.removeItem("frPronClassStarted");
      Object.values(state.recordings).forEach(URL.revokeObjectURL);
      state.progress = {};
      state.names = {};
      state.recordings = {};
      state.screen = 0;
      state.classStarted = Date.now();
      localStorage.setItem("frPronClassStarted", String(state.classStarted));
      render();
      showToast("Session réinitialisée.");
    }

    function resetCurrentActivity() {
      Object.keys(state.progress).forEach(key => {
        if (String(key).includes(`screen-${state.screen}`)) delete state.progress[key];
      });
      if (state.screen === 3) CONFIG.questions.forEach(q => delete state.progress[`question-${q.q}`]);
      if (state.screen === 10) delete state.progress.presentation;
      saveProgress();
      render();
      showToast("Activité actuelle réinitialisée.");
    }

    function formatTime(ms) {
      const total = Math.floor(ms / 1000);
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function tickTimers() {
      $("#classTimer").textContent = formatTime(Date.now() - state.classStarted);
      const activity = state.activityElapsed + (state.activityStarted ? Date.now() - state.activityStarted : 0);
      $("#activityTimer").textContent = formatTime(activity);
    }

    $("#prevTop").addEventListener("click", () => setScreen(state.screen - 1));
    $("#nextTop").addEventListener("click", () => setScreen(state.screen + 1));
    $("#teacherToggle").addEventListener("click", () => toggleTeacher());
    $("#closeTeacher").addEventListener("click", () => toggleTeacher(false));
    $("#teacherScreen").addEventListener("change", e => setScreen(Number(e.target.value)));
    $("#toggleSpanish").addEventListener("click", () => document.body.classList.toggle("show-spanish"));
    $("#toggleMarks").addEventListener("click", () => { state.showMarks = !state.showMarks; render(); });
    $("#clearRecordings").addEventListener("click", () => { state.recordings = {}; updateRecordingButtons(); updateTeacherPanel(); showToast("Grabaciones borradas."); });
    $("#resetCurrentActivity").addEventListener("click", resetCurrentActivity);
    $("#resetAll").addEventListener("click", resetAll);
    $("#startActivity").addEventListener("click", () => { if (!state.activityStarted) state.activityStarted = Date.now(); });
    $("#stopActivity").addEventListener("click", () => {
      if (state.activityStarted) state.activityElapsed += Date.now() - state.activityStarted;
      state.activityStarted = null;
    });
    $("#resetActivity").addEventListener("click", () => { state.activityStarted = null; state.activityElapsed = 0; tickTimers(); });

    document.addEventListener("keydown", event => {
      if (event.target.matches("input, textarea, select")) return;
      if (event.key.toLowerCase() === "p") toggleTeacher();
      if (event.key === "ArrowRight") setScreen(state.screen + 1);
      if (event.key === "ArrowLeft") setScreen(state.screen - 1);
      if (event.key === "Escape") toggleTeacher(false);
    });

    render();
    tickTimers();
    setInterval(tickTimers, 1000);
  </script>
</body>
</html>
