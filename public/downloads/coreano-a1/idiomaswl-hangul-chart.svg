<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hangeúl básico A1: 24 letras y bloques silábicos</title>
  <desc id="desc">Tabla visual de diez vocales, catorce consonantes y cuatro ejemplos de composición de bloques del hangeúl.</desc>
  <rect width="1600" height="1200" fill="#f7f4ee"/>
  <rect width="1600" height="24" fill="#003478"/>
  <rect x="1210" width="390" height="24" fill="#c60c30"/>
  <text x="72" y="90" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#c60c30">IDIOMAS WELEARN · COREANO A1</text>
  <text x="72" y="175" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="72" font-weight="800" fill="#003478">Hangeúl básico</text>
  <text x="72" y="220" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="27" fill="#596579">24 letras esenciales · consonante + vocal + batchim opcional</text>

  <g transform="translate(72 274)">
