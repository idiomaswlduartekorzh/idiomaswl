<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Carrick Bay winter route</title><desc id="desc">Map of Carrick Bay with north at the top. A solid route starts at the car park in the south-west, goes north-east past the stone bridge, bends east and then north-east, and ends near the upper-right rope barrier. The toilets are west of the lower route; marker 2 is near the centre; the ranger store is east of the upper-middle route; the beach steps are on the far eastern side. A dashed summer shore path branches from the central junction to the closed beach steps. Option C is on the first route point north-east of the car park; F is at the central junction beyond the bridge; A is just south-east of F; H is east of marker 2; D is west of the ranger store; B is at the northern end of the route; E is at the bend beside the ranger store; G is beside the beach steps. The option letters are possible locations and are not associated with the listed features in this description.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:20px}.title{font-size:34px;font-weight:700}.label{font-size:19px}.landmark{font-size:17px;font-weight:600}.option{font-size:26px;font-weight:700}</style><rect width="1000" height="650" fill="#fbfcff" /><rect x="22" y="18" width="956.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><rect x="24" y="24" width="952" height="602" rx="18" fill="none" stroke="#14215c" stroke-width="5" /><text x="500" y="62" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CARRICK BAY WINTER ROUTE</text><polyline points="105,570 155,505 235,445 305,382 355,420 430,388 520,350 620,300 700,248 760,160" fill="none" stroke="#596579" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><line x1="305" y1="382" x2="850" y2="305" stroke="#c8202e" stroke-width="7" stroke-dasharray="16 12" /><text x="620" y="465" text-anchor="middle" fill="#c8202e" font-family="Helvetica Neue, Arial, sans-serif">SUMMER SHORE PATH — CLOSED</text><g><circle cx="105" cy="570" r="8" fill="#7a1f2b" /><text x="105" y="600" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CAR PARK</text></g><g><circle cx="55" cy="505" r="8" fill="#7a1f2b" /><text x="35" y="480" text-anchor="start" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">TOILETS</text></g><g><circle cx="235" cy="445" r="8" fill="#7a1f2b" /><text x="118" y="420" text-anchor="start" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">STONE BRIDGE</text></g><g><circle cx="430" cy="388" r="8" fill="#7a1f2b" /><text x="390" y="345" text-anchor="start" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">MARKER 2</text></g><g><circle cx="700" cy="248" r="8" fill="#7a1f2b" /><text x="610" y="210" text-anchor="start" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">RANGER STORE</text></g><g><circle cx="850" cy="305" r="8" fill="#7a1f2b" /><text x="875" y="355" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">BEACH STEPS</text></g><g><circle cx="790" cy="135" r="8" fill="#7a1f2b" /><text x="680" y="105" text-anchor="start" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">ROPE BARRIER</text></g><g aria-label="Candidate option C"><circle cx="155" cy="505" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="155" y="514" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">C</text></g><g aria-label="Candidate option F"><circle cx="305" cy="382" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="305" y="391" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">F</text></g><g aria-label="Candidate option A"><circle cx="355" cy="420" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="355" y="429" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">A</text></g><g aria-label="Candidate option H"><circle cx="520" cy="350" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="520" y="359" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">H</text></g><g aria-label="Candidate option D"><circle cx="620" cy="300" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="620" y="309" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">D</text></g><g aria-label="Candidate option B"><circle cx="760" cy="160" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="760" y="169" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">B</text></g><g aria-label="Candidate option E"><circle cx="700" cy="248" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="700" y="257" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">E</text></g><g aria-label="Candidate option G"><circle cx="850" cy="305" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="850" y="314" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">G</text></g><path d="M900 130v-54m0 0l-12 22m12-22l12 22" stroke="#14215c" stroke-width="4" fill="none" /><text x="900" y="65" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">N</text><rect x="12" y="12" width="976.0" height="626.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>