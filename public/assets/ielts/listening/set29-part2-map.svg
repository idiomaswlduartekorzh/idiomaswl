 <title id="title">Wattle Ridge Arboretum winter visitor map</title><desc id="desc">A schematic trail map with north at the top, fixed landmarks including a triangular Young Eucalypts plot, a blue step-free winter loop, North Creek, one closed crossing and locations A through H. Location A is on the lower south-west bend; location C is on the upper north-west bend immediately south of the triangular plot. Location H is at the end of the only short dead-end blue spur on the far east; location G stays on the main loop beside the central lawn.</desc>
