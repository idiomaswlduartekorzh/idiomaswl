<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Rimu Downs Sky Night — observing field</title><desc id="desc">North is at the top. A north-south grass airstrip occupies the centre, with the west hedge running beside its western perimeter and the east horizon sector beyond its eastern side. Label A is beside the check-in trailer on the south edge. From the south-east arrival lane, the one-way route runs to label B at the south-east threshold, then to label C at the south-west hedge gap, north past label D in the mid-west recess to label E in the north-west circular clearing. It crosses the north end by label G, which is near but not at the north wind sock, passes label F on the north-east horizon spur, and returns south to label H on the east edge beside the arrival lane.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:20px}.title{font-size:34px;font-weight:700}.label{font-size:19px}.landmark{font-size:17px;font-weight:600}.option{font-size:26px;font-weight:700}</style><rect width="1200" height="760" fill="#fbfcff" /><rect x="22" y="18" width="1156.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><rect x="24" y="24" width="1152" height="712" rx="18" fill="none" stroke="#14215c" stroke-width="5" /><text x="600" y="78" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">RIMU DOWNS OBSERVING FIELD</text><rect x="415" y="180" width="360" height="390" rx="18" fill="#eef2f8" stroke="#14215c" stroke-width="5" /><text x="595" y="365" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">GRASS AIRSTRIP</text><path d="M880 650 L880 575 L280 540 L250 200 L600 155 L940 210 L1015 565 L880 650" fill="none" stroke="#7b8494" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 170V575" stroke="#548369" stroke-width="18" /><text x="175" y="350" text-anchor="middle" transform="rotate(-90 175 350)" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">WEST HEDGE</text><path d="M1015 175V485" stroke="#78a5bd" stroke-width="8" stroke-dasharray="14 10" /><text x="1050" y="340" text-anchor="middle" transform="rotate(-90 1050 340)" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">EAST HORIZON</text><path d="M650 145V105l25 10-25 10" fill="none" stroke="#7a1f2b" stroke-width="4" /><text x="690" y="120" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">WIND SOCK</text><text x="165" y="575" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CHECK-IN TRAILER</text><rect x="90" y="590" width="150" height="70" rx="10" fill="#f8eee8" stroke="#7a1f2b" stroke-width="4" /><text x="930" y="690" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">ARRIVAL LANE</text><path d="M1100 150v-62m0 0l-14 24m14-24l14 24" stroke="#14215c" stroke-width="4" fill="none" /><text x="1100" y="77" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">N</text><g aria-label="Candidate option A"><circle cx="170" cy="635" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="170" y="644" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">A</text></g><g aria-label="Candidate option B"><circle cx="870" cy="605" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="870" y="614" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">B</text></g><g aria-label="Candidate option C"><circle cx="270" cy="540" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="270" y="549" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">C</text></g><g aria-label="Candidate option D"><circle cx="260" cy="365" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="260" y="374" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">D</text></g><g aria-label="Candidate option E"><circle cx="245" cy="205" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="245" y="214" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">E</text></g><g aria-label="Candidate option F"><circle cx="940" cy="210" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="940" y="219" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">F</text></g><g aria-label="Candidate option G"><circle cx="590" cy="155" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="590" y="164" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">G</text></g><g aria-label="Candidate option H"><circle cx="1015" cy="565" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="1015" y="574" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">H</text></g><rect x="12" y="12" width="1176.0" height="736.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>