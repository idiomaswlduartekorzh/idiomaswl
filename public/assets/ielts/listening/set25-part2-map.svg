<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">East Dock cargo-bike hub courtyard</title><desc id="desc">A rectangular depot courtyard with a southern entrance, one-way clockwise arrows and eight lettered locations A to H. Fixed non-answer landmarks include a post box, storage door, loading-bay stripes, a waiting shelter, two planters and a staff-room door. The alt text does not identify the six answers.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:20px}.title{font-size:34px;font-weight:700}.label{font-size:19px}.landmark{font-size:17px;font-weight:600}.option{font-size:26px;font-weight:700}</style><rect width="1200" height="760" fill="#fbfcff" /><rect x="22" y="18" width="1156.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><rect x="24" y="24" width="1152" height="712" rx="18" fill="none" stroke="#14215c" stroke-width="5" /><text x="600" y="75" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">EAST DOCK CARGO-BIKE HUB</text><rect x="125" y="140" width="950" height="520" rx="18" fill="#f7f8fb" stroke="#14215c" stroke-width="6" /><path d="M530 680V610H920V215H260V610H530" fill="none" stroke="#7b8494" stroke-width="14" stroke-linecap="round" /><path d="M530 680l-20-18m20 18l20-18M920 420l-18-20m18 20l-18 20M570 215l20-18m-20 18l20 18" stroke="#7b8494" stroke-width="6" fill="none" /><rect x="180" y="185" width="190" height="80" rx="10" fill="#f1e8dc" stroke="#765b40" stroke-width="4" /><path d="M195 250l35-55m10 55l35-55m10 55l35-55m10 55l25-40" stroke="#765b40" stroke-width="4" /><text x="275" y="290" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">STRIPED LOADING BAY</text><rect x="500" y="350" width="250" height="145" rx="14" fill="#eef2f8" stroke="#14215c" stroke-width="4" /><text x="625" y="426" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">WAITING SHELTER</text><rect x="735" y="190" width="120" height="48" rx="6" fill="#fff" stroke="#56687a" stroke-width="4" /><text x="795" y="180" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">STORAGE DOOR</text><rect x="850" y="555" width="135" height="50" rx="6" fill="#dcecf3" stroke="#14215c" stroke-width="4" /><text x="917" y="545" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">STAFF-ROOM DOOR</text><rect x="575" y="575" width="38" height="48" rx="4" fill="#8d2430" stroke="#611923" stroke-width="4" /><text x="594" y="645" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">POST BOX</text><text x="535" y="710" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SOUTHERN ENTRANCE</text><circle cx="330" cy="445" r="25" fill="#dce8d2" stroke="#548369" stroke-width="4" /><circle cx="385" cy="445" r="25" fill="#dce8d2" stroke="#548369" stroke-width="4" /><text x="357" y="492" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">PLANTERS</text><path d="M1100 170v-62m0 0l-12 20m12-20l12 20" stroke="#14215c" stroke-width="4" fill="none" /><text x="1100" y="92" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">N</text><g aria-label="Candidate option A"><circle cx="470" cy="175" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="470" y="184" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">A</text></g><g aria-label="Candidate option B"><circle cx="960" cy="180" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="960" y="189" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">B</text></g><g aria-label="Candidate option C"><circle cx="980" cy="620" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="980" y="629" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">C</text></g><g aria-label="Candidate option D"><circle cx="745" cy="430" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="745" y="439" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">D</text></g><g aria-label="Candidate option E"><circle cx="145" cy="390" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="145" y="399" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">E</text></g><g aria-label="Candidate option F"><circle cx="230" cy="625" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="230" y="634" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">F</text></g><g aria-label="Candidate option G"><circle cx="830" cy="650" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="830" y="659" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">G</text></g><g aria-label="Candidate option H"><circle cx="795" cy="245" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="795" y="254" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">H</text></g><rect x="12" y="12" width="1176.0" height="736.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>