<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1000 900" role="img" aria-labelledby="t d"><title id="t">Riverside regatta volunteer briefing candidate map</title><desc id="d">A linear regatta plan with the river running west to east, town and meadow banks, pedestrian bridge, central pontoon approach, controlled crossing and finish tower. Eight unnamed candidate options A to H are shown without facility answers.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:19px}.title{font-size:31px;font-weight:700}.mark{font-size:25px;font-weight:700}</style><rect width="1000" height="900" fill="#fbfcff" /><rect x="22" y="18" width="956.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><text x="500" y="48" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">RIVERSIDE REGATTA VOLUNTEER BRIEFING</text><path d="M70 360C280 325 720 385 930 340L930 555C700 585 285 520 70 565Z" fill="#b9dced" stroke="#315a70" stroke-width="5" /><path d="M90 300C330 260 710 320 910 285" fill="none" stroke="#8b6b4a" stroke-width="12" /><path d="M90 620C330 580 700 650 910 610" fill="none" stroke="#8b6b4a" stroke-width="12" /><rect x="410" y="250" width="180" height="75" fill="#e9e0ca" stroke="#5c5140" stroke-width="4" /><path d="M560 300v360" stroke="#4d5962" stroke-width="16" /><path d="M430 520v120" stroke="#d17f45" stroke-width="15" stroke-dasharray="18 8" /><rect x="720" y="225" width="75" height="95" fill="#ddd" stroke="#444" stroke-width="4" /><path d="M785 525h120v22H785z" fill="#e5d4a6" stroke="#6b5835" stroke-width="4" /><path d="M410 325v80" stroke="#6b5835" stroke-width="18" /><text x="90" y="225" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">UPSTREAM ←</text><text x="455" y="235" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">RIVERSIDE BUILDING</text><text x="610" y="800" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">PEDESTRIAN BRIDGE</text><text x="705" y="205" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">FINISH TOWER</text><text x="275" y="800" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CONTROLLED CROSSING</text><text x="760" y="650" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">TOWN BANK</text><text x="95" y="205" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">MEADOW BANK</text><text x="470" y="455" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">RIVER →</text><g aria-label="Option A"><circle cx="800" cy="555" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="800" y="564" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">A</text></g><g aria-label="Option B"><circle cx="420" cy="270" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="420" y="279" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">B</text></g><g aria-label="Option C"><circle cx="760" cy="700" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="760" y="709" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">C</text></g><g aria-label="Option D"><circle cx="245" cy="705" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="245" y="714" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">D</text></g><g aria-label="Option E"><circle cx="170" cy="250" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="170" y="259" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">E</text></g><g aria-label="Option F"><circle cx="490" cy="620" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="490" y="629" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">F</text></g><g aria-label="Option G"><circle cx="300" cy="430" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="300" y="439" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">G</text></g><g aria-label="Option H"><circle cx="540" cy="735" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="540" y="744" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">H</text></g><rect x="230" y="855" width="540" height="32" fill="#fff" stroke="#78909c" /><text x="500" y="878" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">Choose from the unnamed options A–H.</text><rect x="12" y="12" width="976.0" height="876.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>