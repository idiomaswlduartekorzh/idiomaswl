    <path d="M132 20 h36" stroke="#76552f" stroke-width="5" stroke-dasharray="10 7" /><text x="176" y="25" class="small" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">track</text>
    <circle cx="249" cy="19" r="6" fill="#e8842e" stroke="#7f3c16" /><circle cx="269" cy="19" r="6" fill="#e8842e" stroke="#7f3c16" /><text x="282" y="25" class="small" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">buoys</text>
    <rect x="361" y="11" width="32" height="15" fill="#ead7a4" stroke="#9b7a43" /><text x="401" y="25" class="small" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">pale shore</text>
  </g>
