  <g data-location="D" aria-label="Location D"><circle cx="455" cy="145" r="27" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="455" y="153" text-anchor="middle" class="loc" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">D</text></g>
