<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Northport Bus Interchange Plan</title>
  <desc id="desc">A polished candidate plan showing Station Road, a pedestrian forecourt, six numbered bus bays and eight unnamed locations A to H.</desc>
  <defs><pattern id="paving" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 12H24M12 0V24" stroke="#e3e8ef" stroke-width="1"/></pattern><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14215c" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="760" fill="#fbfcff"/><rect x="18" y="18" width="1164" height="724" rx="22" fill="none" stroke="#14215c" stroke-width="3"/>
  <rect x="38" y="36" width="1124" height="72" rx="15" fill="#eef3fb"/><rect x="38" y="36" width="14" height="72" rx="7" fill="#c8202e"/>
  <g font-family="Helvetica Neue,Arial,sans-serif" fill="#14215c"><text x="76" y="70" font-size="30" font-weight="700">NORTHPORT BUS INTERCHANGE</text><text x="76" y="94" font-size="15" fill="#5c6680">Passenger plan · choose from options A–H</text><g transform="translate(1080 56)"><text x="0" y="0" text-anchor="middle" font-size="14" font-weight="700">N</text><path d="M0 12V45M0 12l-8 13M0 12l8 13" fill="none" stroke="#14215c" stroke-width="3"/></g></g>
  <!-- northern apron and six clearly numbered bays -->
  <rect x="250" y="139" width="778" height="180" rx="18" fill="#edf1f7" stroke="#53687f" stroke-width="4" filter="url(#shadow)"/>
  <text x="639" y="164" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#5c6680">DEPARTURE APRON</text>
  <g font-family="Helvetica Neue,Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#53687f" stroke-width="3">
    <rect x="273" y="184" width="105" height="104" rx="10"/><rect x="397" y="184" width="105" height="104" rx="10"/><rect x="521" y="184" width="105" height="104" rx="10"/><rect x="645" y="184" width="105" height="104" rx="10"/><rect x="769" y="184" width="105" height="104" rx="10"/><rect x="893" y="184" width="105" height="104" rx="10"/>
  </g><g font-size="17" font-weight="700" fill="#14215c"><text x="325" y="225">BAY 1</text><text x="449" y="225">BAY 2</text><text x="573" y="225">BAY 3</text><text x="697" y="225">BAY 4</text><text x="821" y="225">BAY 5</text><text x="945" y="225">BAY 6</text></g><g fill="#c8202e"><path d="M309 250h32l10 18h-52z"/><path d="M433 250h32l10 18h-52z"/><path d="M557 250h32l10 18h-52z"/><path d="M681 250h32l10 18h-52z"/><path d="M805 250h32l10 18h-52z"/><path d="M929 250h32l10 18h-52z"/></g></g>
  <!-- concourse and forecourt -->
  <rect x="268" y="342" width="698" height="240" rx="16" fill="url(#paving)" stroke="#27364f" stroke-width="6"/><text x="617" y="371" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" fill="#5c6680">PASSENGER CONCOURSE</text>
  <rect x="346" y="405" width="182" height="120" rx="12" fill="#f4f1ff" stroke="#7565a0" stroke-width="3"/><rect x="715" y="397" width="190" height="128" rx="12" fill="#f8f0df" stroke="#aa8d5d" stroke-width="3"/>
  <rect x="568" y="408" width="104" height="74" rx="9" fill="#edf1f7" stroke="#53687f" stroke-width="3"/><text x="620" y="452" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="#5c6680">LIFT</text>
  <g fill="#fff" stroke="#53687f" stroke-width="3"><rect x="570" y="508" width="44" height="42" rx="5"/><rect x="626" y="508" width="44" height="42" rx="5"/></g><text x="620" y="568" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="12" fill="#5c6680">TICKET MACHINES</text>
  <!-- west link, east service road and taxi area -->
  <path d="M268 429H90V320H246" fill="none" stroke="#dce5f2" stroke-width="54" stroke-linejoin="round"/><path d="M268 429H90V320H246" fill="none" stroke="#53687f" stroke-width="5" stroke-linejoin="round"/><text x="91" y="293" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="#5c6680">OLD BUILDING</text>
  <rect x="997" y="343" width="118" height="238" rx="12" fill="#f0f2f5" stroke="#8e9caf" stroke-width="4"/><path d="M1021 383h70M1021 421h70M1021 459h70M1021 497h70M1021 535h70" stroke="#8e9caf" stroke-width="3"/><text x="1056" y="325" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" fill="#5c6680">SERVICE ROAD</text>
  <!-- south road, tactile path and controlled crossing -->
  <rect x="56" y="646" width="1088" height="64" rx="12" fill="#39465b"/><path d="M93 678H1107" stroke="#fff" stroke-width="4" stroke-dasharray="30 22"/><text x="160" y="633" font-family="Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="700" fill="#39465b">STATION ROAD</text>
  <path d="M472 648V582H620V530" fill="none" stroke="#e9c851" stroke-width="20" stroke-dasharray="6 7"/><path d="M432 646v-42M450 646v-42M468 646v-42M486 646v-42M504 646v-42" stroke="#fff" stroke-width="9"/>
  <path d="M472 595L268 508" fill="none" stroke="#dce5f2" stroke-width="28"/><path d="M472 595L268 508" fill="none" stroke="#53687f" stroke-width="4"/>
  <!-- candidate markers -->
  <g font-family="Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#14215c">
    <g aria-label="Location A"><circle cx="170" cy="379" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="170" y="387">A</text></g>
    <g aria-label="Location B"><circle cx="472" cy="608" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="472" y="616">B</text></g>
    <g aria-label="Location C"><circle cx="1056" cy="529" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="1056" y="537">C</text></g>
    <g aria-label="Location D"><circle cx="292" cy="383" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="292" y="391">D</text></g>
    <g aria-label="Location E"><circle cx="808" cy="469" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="808" y="477">E</text></g>
    <g aria-label="Location F"><circle cx="808" cy="356" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="808" y="364">F</text></g>
    <g aria-label="Location G"><circle cx="944" cy="548" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="944" y="556">G</text></g>
    <g aria-label="Location H"><circle cx="435" cy="465" r="25" fill="#fff" stroke="#14215c" stroke-width="4"/><text x="435" y="473">H</text></g>
  </g>
  <text x="1140" y="724" text-anchor="end" font-family="Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="700" fill="#c8202e">WELEARN ORIGINAL PRACTICE</text>
</svg>
