  <title id="title">Harbour Shelf Ocean Pool site plan</title>
  <desc id="desc">North is at the top. The street entrance is on the south edge. Reception is central, lap lanes occupy the centre north, the shallow end is north-west, and a staff store is on the east wall. Eight response locations are marked A to H; the facilities being tested are not named.</desc>
