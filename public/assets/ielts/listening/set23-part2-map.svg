<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Te Awa Community Orchard — open-day route</title><desc id="desc">North is at the top. The south entrance is centred on the bottom edge, with a fixed boot-cleaning point immediately inside. The one-way route turns west to label A beside a low fence in the south-west corner, then goes north past compost bays and label C. Label E lies beside a pond on the west side. The route reaches a central fork around an old pear tree; label D is just east of that tree. Across the northern side, label G is beside the shelterbelt on a closed row, while label F is in flower beds south of a fenced beehive enclosure in the north-east. The harvest barn stands on the east side, with label H on its open western apron. The return route travels south along the eastern boundary past label B beside the tool shed, then reaches the exit immediately east of the entrance.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:20px}.title{font-size:34px;font-weight:700}.label{font-size:19px}.landmark{font-size:17px;font-weight:600}.option{font-size:26px;font-weight:700}</style><rect width="1200" height="760" fill="#fbfcff" /><rect x="22" y="18" width="1156.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><rect x="24" y="24" width="1152" height="712" rx="18" fill="none" stroke="#14215c" stroke-width="5" /><text x="600" y="75" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">TE AWA COMMUNITY ORCHARD</text><path d="M300 125H700" stroke="#548369" stroke-width="12" /><text x="500" y="115" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SHELTERBELT</text><rect x="265" y="185" width="650" height="385" rx="16" fill="#f4f7ec" stroke="#14215c" stroke-width="5" /><text x="590" y="330" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">OLD APPLE BLOCK</text><path d="M335 205H470" stroke="#765b40" stroke-width="5" stroke-dasharray="12 8" /><text x="402" y="238" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CLOSED ROW</text><ellipse cx="120" cy="285" rx="60" ry="42" fill="#dcecf3" stroke="#78a5bd" stroke-width="4" /><text x="120" y="235" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">POND</text><rect x="80" y="430" width="100" height="70" rx="8" fill="#f1e8dc" stroke="#765b40" stroke-width="4" /><text x="130" y="420" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">COMPOST BAYS</text><path d="M125 665H310" stroke="#765b40" stroke-width="5" stroke-dasharray="12 8" /><text x="217" y="695" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">LOW FENCE</text><circle cx="545" cy="410" r="35" fill="#dce8d2" stroke="#548369" stroke-width="5" /><text x="545" y="475" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">PEAR TREE</text><path d="M600 680 L600 620 L170 625 L185 470 L120 285 L410 155 L800 210 L985 350 L955 620 L680 680" fill="none" stroke="#7b8494" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><g fill="#f1e8dc" stroke="#765b40" stroke-width="3"><circle cx="760" cy="145" r="18" /><circle cx="805" cy="145" r="18" /><circle cx="850" cy="145" r="18" /></g><text x="805" y="115" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">BEEHIVES</text><rect x="720" y="180" width="175" height="95" rx="10" fill="#eef4e8" stroke="#548369" stroke-width="4" /><text x="807" y="300" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">FLOWER BEDS</text><rect x="920" y="260" width="190" height="130" rx="10" fill="#f1e8dc" stroke="#765b40" stroke-width="4" /><text x="1015" y="325" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">HARVEST BARN</text><rect x="850" y="570" width="145" height="80" rx="10" fill="#edf1f6" stroke="#56687a" stroke-width="4" /><text x="922" y="610" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">TOOL SHED</text><rect x="545" y="575" width="110" height="45" rx="8" fill="#fff" stroke="#56687a" stroke-width="4" /><text x="600" y="603" text-anchor="middle" class="landmark" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">BOOT CLEANING</text><text x="640" y="710" text-anchor="middle" class="label" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SOUTH ENTRANCE / EXIT</text><path d="M1100 150v-62m0 0l-12 20m12-20l12 20" stroke="#14215c" stroke-width="4" fill="none" /><text x="1100" y="72" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">N</text><g aria-label="Candidate option A"><circle cx="170" cy="625" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="170" y="634" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">A</text></g><g aria-label="Candidate option B"><circle cx="955" cy="620" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="955" y="629" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">B</text></g><g aria-label="Candidate option C"><circle cx="185" cy="470" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="185" y="479" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">C</text></g><g aria-label="Candidate option D"><circle cx="560" cy="405" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="560" y="414" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">D</text></g><g aria-label="Candidate option E"><circle cx="120" cy="285" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="120" y="294" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">E</text></g><g aria-label="Candidate option F"><circle cx="800" cy="210" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="800" y="219" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">F</text></g><g aria-label="Candidate option G"><circle cx="410" cy="155" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="410" y="164" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">G</text></g><g aria-label="Candidate option H"><circle cx="985" cy="350" r="27" fill="#fff" stroke="#14215c" stroke-width="5" /><text x="985" y="359" text-anchor="middle" class="option" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">H</text></g><rect x="12" y="12" width="1176.0" height="736.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>