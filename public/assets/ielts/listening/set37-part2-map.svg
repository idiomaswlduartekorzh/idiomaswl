<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1000 900" role="img" aria-labelledby="t d"><title id="t">Foxton lock-flight volunteer briefing candidate map</title><desc id="d">A stepped canal lock flight running north to south. Fixed labels show the south entrance, café, overflow channel, towpath, middle lock pound, footbridge and upstream direction. Eight unnamed candidate options A to H are shown without facility answers.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#14215c;font-size:19px}.title{font-size:31px;font-weight:700}.mark{font-size:25px;font-weight:700}</style><rect width="1000" height="900" fill="#fbfcff" /><rect x="22" y="18" width="956.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><text x="500" y="48" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">FOXTON LOCK-FLIGHT VOLUNTEER BRIEFING</text><path d="M420 730h170v95H420z M410 570h190v105H410z M425 400h165v105H425z M440 230h145v105H440z" fill="#d8edf5" stroke="#315a70" stroke-width="5" /><path d="M505 825V230" stroke="#6ba6c8" stroke-width="26" /><path d="M365 825V215" stroke="#8b6b4a" stroke-width="13" stroke-dasharray="18 10" /><path d="M585 360h210" stroke="#8b6b4a" stroke-width="12" /><path d="M575 335v55M620 335v55" stroke="#315a70" stroke-width="6" /><path d="M120 180v310" stroke="#6ba6c8" stroke-width="35" opacity=".65" /><rect x="205" y="430" width="95" height="70" fill="#e9e0ca" stroke="#5c5140" stroke-width="4" /><rect x="700" y="375" width="150" height="100" rx="18" fill="#dcebcf" stroke="#56724a" stroke-width="4" /><rect x="690" y="670" width="145" height="80" fill="#efe3cf" stroke="#725c3c" stroke-width="4" /><text x="110" y="155" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">OVERFLOW CHANNEL</text><text x="560" y="838" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SOUTH ENTRANCE</text><text x="250" y="545" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SMALL SHED</text><text x="685" y="350" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">FOOTBRIDGE</text><text x="705" y="770" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">CAFÉ</text><text x="600" y="520" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">MIDDLE LOCK POUND</text><text x="300" y="320" transform="rotate(-90 300 320)" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">TOWPATH</text><text x="850" y="105" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">NORTH / UPSTREAM ↑</text><g aria-label="Option A"><circle cx="145" cy="280" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="145" y="289" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">A</text></g><g aria-label="Option B"><circle cx="505" cy="760" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="505" y="769" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">B</text></g><g aria-label="Option C"><circle cx="255" cy="470" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="255" y="479" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">C</text></g><g aria-label="Option D"><circle cx="770" cy="430" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="770" y="439" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">D</text></g><g aria-label="Option E"><circle cx="650" cy="700" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="650" y="709" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">E</text></g><g aria-label="Option F"><circle cx="790" cy="155" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="790" y="164" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">F</text></g><g aria-label="Option G"><circle cx="500" cy="260" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="500" y="269" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">G</text></g><g aria-label="Option H"><circle cx="345" cy="805" r="28" fill="#ffffff" stroke="#14215c" stroke-width="4" /><text x="345" y="814" text-anchor="middle" class="mark" fill="#14215c" font-weight="700" font-family="Helvetica Neue, Arial, sans-serif">H</text></g><rect x="230" y="855" width="540" height="32" fill="#fff" stroke="#78909c" /><text x="500" y="878" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">Choose from the unnamed options A–H.</text><rect x="12" y="12" width="976.0" height="876.0" rx="18" fill="none" stroke="#14215c" stroke-width="3" /></svg>