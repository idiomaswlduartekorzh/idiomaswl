<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Riverside Produce Auction — candidate plan</title><desc id="desc">North is at the top. Eight unnamed locations are marked A to H. Use the recording to match facilities to letters.</desc><style>text{font-family:'Helvetica Neue',Arial,sans-serif;font-size:18px;fill:#14215c}.loc{font-size:24px;font-weight:700}.title{font-size:27px;font-weight:700}</style><rect width="900" height="620" fill="#fbfcff" /><rect x="22" y="18" width="856.0" height="60" rx="14" fill="#eef3fb" stroke="#d3dbea" stroke-width="2" /><text x="450" y="40" text-anchor="middle" class="title" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">Riverside Produce Auction — candidate plan</text><path d="M820 105 V60 M820 60 l-12 20 M820 60 l12 20" stroke="#172a3a" stroke-width="4" fill="none" /><text x="820" y="125" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">NORTH</text><rect x="105" y="78" width="690" height="430" rx="6" fill="#fffdf8" stroke="#20354a" stroke-width="5" /><path d="M285 78 V225 M525 78 V225 M285 225 H795 M285 225 V425 M525 225 V508 M285 425 H525 M360 425 V508 M540 508 V565 M360 508 V565" stroke="#6d7b86" stroke-width="4" fill="none" /><path d="M445 508 V535" stroke="#fffdf8" stroke-width="10" /><path d="M445 508 V535" stroke="#20354a" stroke-width="3" stroke-dasharray="5 5" /><rect x="360" y="520" width="180" height="44" rx="8" fill="#d7e6f5" stroke="#20354a" /><text x="450" y="548" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">VISITOR ENTRANCE</text><path d="M65 105 V500" stroke="#72808c" stroke-width="24" /><text x="80" y="302" transform="rotate(-90 80 302)" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" fill="#14215c">SERVICE LANE</text><path d="M120 250 H265 M545 250 H775" stroke="#b4a88f" stroke-width="10" stroke-linecap="round" /