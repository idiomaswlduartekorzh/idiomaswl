<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Riverview neighbourhood flood-drill map</title>
  <desc id="desc">A high-contrast schematic map with the Red River at the north, a community centre in the south-west, a neutral marked path, two road closures, named streets, fixed landmarks and eight locations labelled A through H. No candidate marker is singled out by a path endpoint or functional area label.</desc>
