<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Global Average Sea Surface Temperature — 1980 to 2022 (°C above 1961–1990 baseline)</text>

  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis: -0.2 to 1.0 °C, range=1.2, 270px total, 1px=0.00444°C -->
  <text x="72" y="324" text-anchor="end" font-size="10" fill="#666">−0.2</text>
  <text x="72" y="279" text-anchor="end" font-size="10" fill="#666">0.0</text>
  <text x="72" y="234" text-anchor="end" font-size="10" fill="#666">0.2</text>
  <text x="72" y="189" text-anchor="end" font-size="10" fill="#666">0.4</text>
  <text x="72" y="144" text-anchor="end" font-size="10" fill="#666">0.6</text>
  <text x="72" y="99" text-anchor="end" font-size="10" fill="#666">0.8</text>
  <text x="72" y="54" text-anchor="end" font-size="10" fill="#666">1.0</text>

  <!-- Y gridlines -->
  <line x1="80" y1="279" x2="640" y2="279" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="80" y1="234" x2="640" y2="234" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="80" y1="189" x2="640" y2="189" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="80" y1="144" x2="640" y2="144" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="80" y1="99"  x2="640" y2="99"  stroke="#e5e7eb" stroke-width="1"/>

  <!-- X-axis labels: 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2022 -->
  <!-- 560px / 42 years ≈ 13.33px/year; positions: 1980=80, 1985=147, 1990=213, 1995=280, 2000=347, 2005=413, 2010=480, 2015=547, 2022=640 -->
  <text x="80"  y="335" text-anchor="middle" font-size="10" fill="#666">1980</text>
  <text x="147" y="335" text-anchor="middle" font-size="10" fill="#666">1985</text>
  <text x="213" y="335" text-anchor="middle" font-size="10" fill="#666">1990</text>
  <text x="280" y="335" text-anchor="middle" font-size="10" fill="#666">1995</text>
  <text x="347" y="335" text-anchor="middle" font-size="10" fill="#666">2000</text>
  <text x="413" y="335" text-anchor="middle" font-size="10" fill="#666">2005</text>
  <text x="480" y="335" text-anchor="middle" font-size="10" fill="#666">2010</text>
  <text x="547" y="335" text-anchor="middle" font-size="10" fill="#666">2015</text>
  <text x="640" y="335" text-anchor="middle" font-size="10" fill="#666">2022</text>

  <!-- y = 320 - (val + 0.2) * 225  where 225 = 270/1.2 -->
  <!-- val=-0.2 → y=320; val=0→y=275; val=0.2→y=230; val=0.4→y=185; val=0.6→y=140; val=0.8→y=95; val=1.0→y=50 -->

  <!-- Data: 1980=0.05, 1985=0.1, 1990=0.15, 1995=0.25, 2000=0.35, 2005=0.45, 2010=0.55, 2015=0.72, 2022=0.91 -->
  <!-- y for each: 0.05→(0.05+0.2)*225=56.25 → y=263; 0.1→y=252; 0.15→y=241; 0.25→y=219; 0.35→y=197; 0.45→y=174; 0.55→y=152; 0.72→y=114; 0.91→y=72 -->

  <polyline points="80,263 147,252 213,241 280,219 347,197 413,174 480,152 547,114 640,72"
    fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shaded area under curve -->
  <polygon points="80,279 80,263 147,252 213,241 280,219 347,197 413,174 480,152 547,114 640,72 640,279"
    fill="#fca5a5" opacity="0.3"/>

  <!-- Data points -->
  <circle cx="80"  cy="263" r="4" fill="#ef4444"/>
  <circle cx="147" cy="252" r="4" fill="#ef4444"/>
  <circle cx="213" cy="241" r="4" fill="#ef4444"/>
  <circle cx="280" cy="219" r="4" fill="#ef4444"/>
  <circle cx="347" cy="197" r="4" fill="#ef4444"/>
  <circle cx="413" cy="174" r="4" fill="#ef4444"/>
  <circle cx="480" cy="152" r="4" fill="#ef4444"/>
  <circle cx="547" cy="114" r="4" fill="#ef4444"/>
  <circle cx="640" cy="72"  r="4" fill="#ef4444"/>

  <!-- Zero baseline -->
  <line x1="80" y1="279" x2="640" y2="279" stroke="#374151" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="644" y="282" font-size="9" fill="#374151">0°C</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="18" text-anchor="middle" font-size="11" fill="#374151">Temperature anomaly (°C)</text>

  <!-- Legend -->
  <line x1="268" y1="373" x2="296" y2="373" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="282" cy="373" r="4" fill="#ef4444"/>
  <text x="300" y="377" font-size="11" fill="#333">Sea surface temperature anomaly</text>
</svg>
