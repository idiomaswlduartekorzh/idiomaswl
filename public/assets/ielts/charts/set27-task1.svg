      <path class="data-slice" d="M 460 530 L 260.94 436.33 A 220 220 0 0 1 460 310 Z" fill="url(#master-storage)" stroke="#17324D" stroke-width="7"/>
      <polyline class="leader" points="337.83,337.49 307.3,289.4" fill="none" stroke="#526B82" stroke-width="3"/>
