<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Routes used for unwanted household textiles in a fictional regional survey</title><desc id="chart-desc">The two equal-sized pie charts show percentage shares for four routes. In 2012, reuse accounted for 18%, recycling 12%, waste 52% and storage 18%. In 2025, reuse accounted for 31%, recycling 34%, waste 22% and storage 13%. Each year totals 100%.</desc>
  <defs>
    <pattern id="master-recycling" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#EAF3EE"/><line x1="0" y1="0" x2="0" y2="12" stroke="#3C7D5A" stroke-width="5"/></pattern>
    <pattern id="master-waste" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#FFF1F1"/><circle cx="4" cy="4" r="2.6" fill="#B33A3A"/><circle cx="11" cy="11" r="2.6" fill="#B33A3A"/></pattern>
    <pattern id="master-storage" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#FFF5E9"/><path d="M-2 2 L2 -2 M0 14 L14 0 M12 16 L16 12 M12 -2 L16 2 M0 0 L14 14 M-2 12 L2 16" stroke="#D9822B" stroke-width="2.5"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H270 L40 270 Z" fill="#F2EEFA"/><path d="M1560 960 H1330 L1560 730 Z" fill="#F2EEFA"/><rect x="40" y="40" width="1520" height="920" rx="8" fill="none" stroke="#17324D" stroke-width="5"/>
  <g font-family="Arial, Helvetica, sans-serif">
