    <text x="75" y="940" font-size="22" fill="#17324D">Source: author-created fictional data for WeLearn Original Practice</text><text x="1525" y="940" text-anchor="end" font-size="22" font-weight="700" fill="#17324D">WeLearn Original Practice</text>
