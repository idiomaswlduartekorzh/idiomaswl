      <polyline class="leader" points="912.45,515.68 855.6,512.1" fill="none" stroke="#526B82" stroke-width="3"/>
      <text class="direct-label" x="825" y="508.1" text-anchor="start" font-size="24" font-weight="700" fill="#17324D" stroke="#FFFFFF" stroke-width="6" paint-order="stroke fill" stroke-linejoin="round"><tspan x="825" dy="0">Waste</tspan><tspan x="825" dy="27">22%</tspan></text>
    </g>
<g class="slice-group" data-year="2025" data-category="Storage" data-value="13" data-start="223.2" data-end="270" data-radius="220" data-encoding="storage" data-border-style="single-thick">
