    <text x="800" y="148" text-anchor="middle" font-size="42" font-weight="700" fill="#17324D">in a fictional regional survey</text>
    <text x="800" y="184" text-anchor="middle" font-size="27" fill="#17324D">Percentage share by route, 2012 and 2025</text>
    <g aria-label="Legend"><g class="legend-entry"><rect class="legend-swatch" data-legend="Reuse" data-border-style="single" x="345" y="206" width="30" height="24" fill="#2D6F9F" stroke="#17324D" stroke-width="3"/><text x="387" y="226" font-size="24" fill="#17324D">Reuse</text></g>
<g class="legend-entry"><rect class="legend-swatch" data-legend="Recycling" data-border-style="double" x="590" y="206" width="30" height="24" fill="url(#master-recycling)" stroke="#3C7D5A" stroke-width="3"/><rect x="593" y="209" width="24" height="18" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="632" y="226" font-size="24" fill="#17324D">Recycling</text></g>
<g class="legend-entry"><rect class="legend-swatch" data-legend="Waste" data-border-style="dashed" x="835" y="206" width="30" height="24" fill="url(#master-waste)" stroke="#B33A3A" stroke-width="3" stroke-dasharray="8 5"/><text x="877" y="226" font-size="24" fill="#17324D">Waste</text></g>
<g class="legend-entry"><rect class="legend-swatch" data-legend="Storage" data-border-style="single-thick" x="1080" y="206" width="30" height="24" fill="url(#master-storage)" stroke="#17324D" stroke-width="6"/><text x="1122" y="226" font-size="24" fill="#17324D">Storage</text></g></g>
    <g class="slice-group" data-year="2012" data-category="Reuse" data-value="18" data-start="-90" data-end="-25.2" data-radius="220" data-encoding="reuse" data-border-style="single">
