      <path class="data-slice" d="M 1140 530 L 1344.55 610.99 A 220 220 0 0 1 962.02 659.31 Z" fill="url(#master-recycling)" stroke="#3C7D5A" stroke-width="6"/><path d="M 1140 530 L 1344.55 610.99 A 220 220 0 0 1 962.02 659.31 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.9"/>
      <polyline class="leader" points="1168.58,756.2 1175.7,812.8" fill="none" stroke="#526B82" stroke-width="3"/>
