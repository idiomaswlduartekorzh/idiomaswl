  <title id="chart-title">Seasonal water use at a fictional municipal swimming centre</title><desc id="chart-desc">The chart compares three uses of water across four seasons, measured in cubic metres on a zero-based scale from 0 to 1,400. In winter, pools use 820 cubic metres, showers 430 and cleaning 260. In spring, the figures are 910, 510 and 275. In summer, they are 1,260, 760 and 320. In autumn, they are 980, 560 and 285.</desc>
