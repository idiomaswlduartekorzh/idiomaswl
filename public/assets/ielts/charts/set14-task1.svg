<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="system-ui,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Municipal wastewater treatment and reuse</title>
  <desc id="desc">A simplified process. Wastewater from homes and businesses is screened, settled, treated biologically and disinfected. Sludge from settling goes to biogas recovery. Treated water is either reused for irrigation and industry or discharged after meeting standards.</desc>
  <rect width="680" height="430" fill="#fafafa" rx="8"/>
  <text x="340" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">How Municipal Wastewater Is Treated and Reused</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#374151"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Step 1: Raw Sewage Collection -->
  <rect x="20" y="80" width="100" height="50" fill="#6b7280" rx="6"/>
  <text x="70" y="101" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">RAW SEWAGE</text>
  <text x="70" y="115" text-anchor="middle" font-size="9" fill="#ddd">Collection</text>
  <text x="70" y="146" text-anchor="middle" font-size="9" fill="#374151">① Collected from</text>
  <text x="70" y="158" text-anchor="middle" font-size="9" fill="#374151">homes &amp; businesses</text>

  <!-- Arrow 1→2 -->
  <line x1="122" y1="105" x2="158" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: Screening -->
  <rect x="160" y="80" width="100" height="50" fill="#92400e" rx="6"/>
  <text x="210" y="101" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">SCREENING</text>
  <text x="210" y="115" text-anchor="middle" font-size="9" fill="#fde68a">Inlet stage</text>
  <text x="210" y="146" text-anchor="middle" font-size="9" fill="#374151">② Large solids &amp;</text>
  <text x="210" y="158" text-anchor="middle" font-size="9" fill="#374151">debris removed</text>

  <!-- Arrow 2→3 -->
  <line x1="262" y1="105" x2="298" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Primary Treatment -->
  <rect x="300" y="80" width="100" height="50" fill="#b45309" rx="6"/>
  <text x="350" y="97" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">PRIMARY</text>
  <text x="350" y="110" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">TREATMENT</text>
  <text x="350" y="146" text-anchor="middle" font-size="9" fill="#374151">③ Settling tanks</text>
  <text x="350" y="158" text-anchor="middle" font-size="9" fill="#374151">remove sludge</text>

  <!-- Arrow 3→4 -->
  <line x1="402" y1="105" x2="438" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: Biological Treatment -->
  <rect x="440" y="80" width="110" height="50" fill="#1d4ed8" rx="6"/>
  <text x="495" y="97" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">BIOLOGICAL</text>
  <text x="495" y="110" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">TREATMENT</text>
  <text x="495" y="146" text-anchor="middle" font-size="9" fill="#374151">④ Bacteria break</text>
  <text x="495" y="158" text-anchor="middle" font-size="9" fill="#374151">down organics</text>

  <!-- Arrow 4→5 (down) -->
  <line x1="495" y1="132" x2="495" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: Disinfection -->
  <rect x="440" y="198" width="110" height="50" fill="#6d28d9" rx="6"/>
  <text x="495" y="222" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">DISINFECTION</text>
  <text x="495" y="264" text-anchor="middle" font-size="9" fill="#374151">⑤ Pathogens reduced:</text>
  <text x="495" y="276" text-anchor="middle" font-size="9" fill="#374151">chlorine / UV</text>

  <!-- Arrow 5 → two outputs (left and down) -->
  <!-- Arrow to Recycled Water (left) -->
  <line x1="438" y1="223" x2="290" y2="223" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Arrow 5 → River/Sea (down) -->
  <line x1="495" y1="250" x2="495" y2="310" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Recycled Water Box -->
  <rect x="150" y="198" width="138" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="6"/>
  <text x="219" y="218" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">RECYCLED</text>
  <text x="219" y="231" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="700">WATER</text>
  <text x="219" y="264" text-anchor="middle" font-size="9" fill="#374151">⑥ Irrigation,</text>
  <text x="219" y="276" text-anchor="middle" font-size="9" fill="#374151">industrial reuse</text>

  <!-- River/Sea box -->
  <rect x="440" y="312" width="110" height="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="495" y="332" text-anchor="middle" font-size="10" fill="#15803d" font-weight="700">RIVER / SEA</text>
  <text x="495" y="345" text-anchor="middle" font-size="10" fill="#15803d" font-weight="700">DISCHARGE</text>
  <text x="495" y="374" text-anchor="middle" font-size="9" fill="#374151">⑦ After meeting</text>
  <text x="495" y="386" text-anchor="middle" font-size="9" fill="#374151">discharge standards</text>

  <!-- Sludge output from Primary Treatment -->
  <line x1="350" y1="132" x2="350" y2="296" stroke="#92400e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <rect x="296" y="300" width="108" height="40" fill="#fef3c7" stroke="#92400e" stroke-width="1.5" rx="4"/>
  <text x="350" y="316" text-anchor="middle" font-size="9" fill="#92400e" font-weight="700">SLUDGE → BIOGAS</text>
  <text x="350" y="330" text-anchor="middle" font-size="9" fill="#92400e">energy recovery</text>

  <!-- Step labels at top -->
  <text x="340" y="414" text-anchor="middle" font-size="9" fill="#6b7280">Main flow: collection → screening → settling → biological treatment → disinfection</text>
</svg>
