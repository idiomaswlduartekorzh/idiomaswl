<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">University Enrolment by Subject Area — 2005 vs 2023 (thousands)</text>

  <!-- Axes -->
  <line x1="100" y1="50" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="92" y="324" text-anchor="end" font-size="10" fill="#666">0</text>
  <text x="92" y="274" text-anchor="end" font-size="10" fill="#666">50</text>
  <text x="92" y="224" text-anchor="end" font-size="10" fill="#666">100</text>
  <text x="92" y="174" text-anchor="end" font-size="10" fill="#666">150</text>
  <text x="92" y="124" text-anchor="end" font-size="10" fill="#666">200</text>
  <text x="92" y="74" text-anchor="end" font-size="10" fill="#666">250</text>

  <!-- Y gridlines -->
  <line x1="100" y1="270" x2="650" y2="270" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="220" x2="650" y2="220" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="170" x2="650" y2="170" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="120" x2="650" y2="120" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="70" x2="650" y2="70" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Scale: 250 units = 250px, so 1 unit = 1px, origin at y=320 -->

  <!-- Business & Management: 2005=155, 2023=210 -->
  <rect x="118" y="165" width="30" height="155" fill="#3b82f6"/>
  <rect x="152" y="110" width="30" height="210" fill="#f97316"/>
  <text x="161" y="336" text-anchor="middle" font-size="9" fill="#374151">Business</text>

  <!-- Computer Science: 2005=85, 2023=195 -->
  <rect x="220" y="235" width="30" height="85" fill="#3b82f6"/>
  <rect x="254" y="125" width="30" height="195" fill="#f97316"/>
  <text x="263" y="336" text-anchor="middle" font-size="9" fill="#374151">Computer</text>
  <text x="263" y="347" text-anchor="middle" font-size="9" fill="#374151">Science</text>

  <!-- Engineering: 2005=120, 2023=160 -->
  <rect x="322" y="200" width="30" height="120" fill="#3b82f6"/>
  <rect x="356" y="160" width="30" height="160" fill="#f97316"/>
  <text x="351" y="336" text-anchor="middle" font-size="9" fill="#374151">Engineering</text>

  <!-- Health Sciences: 2005=98, 2023=225 -->
  <rect x="424" y="222" width="30" height="98" fill="#3b82f6"/>
  <rect x="458" y="95" width="30" height="225" fill="#f97316"/>
  <text x="452" y="336" text-anchor="middle" font-size="9" fill="#374151">Health</text>
  <text x="452" y="347" text-anchor="middle" font-size="9" fill="#374151">Sciences</text>

  <!-- Humanities: 2005=210, 2023=140 -->
  <rect x="526" y="110" width="30" height="210" fill="#3b82f6"/>
  <rect x="560" y="180" width="30" height="140" fill="#f97316"/>
  <text x="558" y="336" text-anchor="middle" font-size="9" fill="#374151">Humanities</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="22" text-anchor="middle" font-size="11" fill="#374151">Students enrolled (thousands)</text>

  <!-- Legend -->
  <rect x="230" y="368" width="14" height="12" fill="#3b82f6" rx="2"/>
  <text x="248" y="379" font-size="11" fill="#333">2005</text>
  <rect x="310" y="368" width="14" height="12" fill="#f97316" rx="2"/>
  <text x="328" y="379" font-size="11" fill="#333">2023</text>
</svg>
