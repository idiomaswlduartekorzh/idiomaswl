<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="visual-title visual-desc">
  <title id="visual-title">Quarterly visitors and average visit duration at a fictional metropolitan museum</title><desc id="visual-desc">The chart contains six chronological quarters. For each quarter, a bar corresponds to museum visits in thousands on the zero-based left axis, and a circle marker on a line corresponds to average visit duration in minutes on the separately labelled right axis. Exact values are available in the associated semantic table. This description deliberately does not identify main features or interpret trends.</desc><defs>
  <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#C64B45"/></marker>
  <pattern id="blue-lines" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#EAF3F8"/><path d="M0 4 H14 M0 11 H14" stroke="#2F6F9F" stroke-width="2"/></pattern>
  <pattern id="orange-grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF4E8"/><path d="M0 0 L12 12 M12 0 L0 12" stroke="#C26B1D" stroke-width="1.5"/></pattern>
  <pattern id="green-dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#EDF6EF"/><circle cx="3" cy="3" r="2" fill="#3F7D5A"/><circle cx="9" cy="9" r="2" fill="#3F7D5A"/></pattern>
  <pattern id="red-hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF0EF"/><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#C64B45" stroke-width="2"/></pattern>
</defs>
