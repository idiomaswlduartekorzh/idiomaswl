  <title id="table-title">Percentage of five fresh foods discarded under three household storage conditions</title><desc id="table-desc">The table reports the percentage of purchased quantity discarded for five fresh foods under three storage conditions. For leafy greens, the percentages are 9% refrigerated, 34% on the countertop and 21% in a ventilated box. For berries, they are 12%, 29% and 24%. For tomatoes, they are 18%, 16% and 10%. For root vegetables, they are 8%, 11% and 7%. For fresh herbs, they are 14%, 41% and 28%. No row or column totals are shown or implied.</desc>
