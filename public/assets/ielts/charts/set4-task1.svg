<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Average weekday bicycle entries at four gates of a fictional university campus, 2015 to 2025</title>
  <desc id="desc">A line graph with six observation years. North Gate remains busiest overall despite a fall in 2021. All four gates finish above their 2015 levels, and Riverside Gate records the largest proportional rise.</desc>
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="27" text-anchor="middle" font-size="13" font-weight="700" fill="#172554">Fictional Bellwick University: average weekday bicycle entries</text>
  <text x="18" y="195" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90,18,195)">Bicycles per weekday</text>

  <line x1="70" y1="50" x2="70" y2="320" stroke="#94a3b8"/>
  <line x1="70" y1="320" x2="630" y2="320" stroke="#94a3b8"/>
  <g stroke="#dbe3ee" stroke-dasharray="4 4">
    <line x1="70" y1="50" x2="630" y2="50"/>
    <line x1="70" y1="110" x2="630" y2="110"/>
    <line x1="70" y1="170" x2="630" y2="170"/>
    <line x1="70" y1="230" x2="630" y2="230"/>
    <line x1="70" y1="290" x2="630" y2="290"/>
  </g>

  <g fill="#475569" font-size="10" text-anchor="end">
    <text x="63" y="324">0</text>
    <text x="63" y="294">100</text>
    <text x="63" y="234">300</text>
    <text x="63" y="174">500</text>
    <text x="63" y="114">700</text>
    <text x="63" y="54">900</text>
  </g>
  <g fill="#475569" font-size="10" text-anchor="middle">
    <text x="70" y="337">2015</text>
    <text x="178" y="337">2017</text>
    <text x="286" y="337">2019</text>
    <text x="394" y="337">2021</text>
    <text x="502" y="337">2023</text>
    <text x="610" y="337">2025</text>
  </g>

  <polyline points="70,176 178,164 286,137 394,203 502,113 610,74" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="70,215 178,194 286,179 394,227 502,158 610,140" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 4" stroke-linejoin="round"/>
  <polyline points="70,248 178,236 286,212 394,254 502,191 610,167" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="2 4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="70,266 178,251 286,233 394,242 502,215 610,182" fill="none" stroke="#7e22ce" stroke-width="3" stroke-dasharray="12 3 2 3" stroke-linejoin="round"/>

  <g fill="#172554">
    <circle cx="70" cy="176" r="3"/><circle cx="178" cy="164" r="3"/><circle cx="286" cy="137" r="3"/><circle cx="394" cy="203" r="3"/><circle cx="502" cy="113" r="3"/><circle cx="610" cy="74" r="3"/>
  </g>

  <g font-size="11" fill="#334155">
    <line x1="82" y1="365" x2="106" y2="365" stroke="#1d4ed8" stroke-width="3"/><text x="112" y="369">North Gate</text>
    <line x1="212" y1="365" x2="236" y2="365" stroke="#b91c1c" stroke-width="3" stroke-dasharray="9 4"/><text x="242" y="369">East Gate</text>
    <line x1="330" y1="365" x2="354" y2="365" stroke="#15803d" stroke-width="3" stroke-dasharray="2 4"/><text x="360" y="369">Library Gate</text>
    <line x1="474" y1="365" x2="498" y2="365" stroke="#7e22ce" stroke-width="3" stroke-dasharray="12 3 2 3"/><text x="504" y="369">Riverside Gate</text>
  </g>
  <text x="630" y="391" text-anchor="end" font-size="9" fill="#64748b">Original fictional WeLearn dataset</text>
</svg>
