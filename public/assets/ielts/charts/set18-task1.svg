<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">The Plastic Recycling Process</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#374151"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Row 1 boxes (y=70) -->
  <!-- Box 1: Collection -->
  <rect x="20" y="70" width="100" height="48" fill="#6b7280" rx="6"/>
  <text x="70" y="90" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">COLLECTION</text>
  <text x="70" y="104" text-anchor="middle" font-size="9" fill="#ddd">Bins &amp; kerb-side</text>
  <text x="70" y="132" text-anchor="middle" font-size="9" fill="#374151">① Plastic waste</text>
  <text x="70" y="144" text-anchor="middle" font-size="9" fill="#374151">collected</text>

  <line x1="122" y1="94" x2="158" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 2: Sorting -->
  <rect x="160" y="70" width="100" height="48" fill="#b45309" rx="6"/>
  <text x="210" y="90" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">SORTING</text>
  <text x="210" y="104" text-anchor="middle" font-size="9" fill="#fde68a">by resin type</text>
  <text x="210" y="132" text-anchor="middle" font-size="9" fill="#374151">② Infrared sensors</text>
  <text x="210" y="144" text-anchor="middle" font-size="9" fill="#374151">identify plastic type</text>

  <line x1="262" y1="94" x2="298" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 3: Shredding -->
  <rect x="300" y="70" width="100" height="48" fill="#1d4ed8" rx="6"/>
  <text x="350" y="90" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">SHREDDING</text>
  <text x="350" y="104" text-anchor="middle" font-size="9" fill="#bfdbfe">&amp; Washing</text>
  <text x="350" y="132" text-anchor="middle" font-size="9" fill="#374151">③ Broken into</text>
  <text x="350" y="144" text-anchor="middle" font-size="9" fill="#374151">small flakes</text>

  <line x1="402" y1="94" x2="438" y2="94" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 4: Melting -->
  <rect x="440" y="70" width="100" height="48" fill="#dc2626" rx="6"/>
  <text x="490" y="90" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">MELTING</text>
  <text x="490" y="104" text-anchor="middle" font-size="9" fill="#fca5a5">&amp; Extrusion</text>
  <text x="490" y="132" text-anchor="middle" font-size="9" fill="#374151">④ Flakes melted</text>
  <text x="490" y="144" text-anchor="middle" font-size="9" fill="#374151">into pellets</text>

  <!-- Arrow down from Melting -->
  <line x1="490" y1="120" x2="490" y2="195" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Row 2 boxes (y=198) -->
  <!-- Box 5: Quality Testing -->
  <rect x="440" y="198" width="100" height="48" fill="#7c3aed" rx="6"/>
  <text x="490" y="214" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">QUALITY</text>
  <text x="490" y="227" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">TESTING</text>
  <text x="490" y="262" text-anchor="middle" font-size="9" fill="#374151">⑤ Pellets tested</text>
  <text x="490" y="274" text-anchor="middle" font-size="9" fill="#374151">for purity</text>

  <!-- Arrow left from Testing -->
  <line x1="438" y1="222" x2="362" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 6: Manufacturing -->
  <rect x="260" y="198" width="100" height="48" fill="#16a34a" rx="6"/>
  <text x="310" y="214" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">MANUFACTURE</text>
  <text x="310" y="228" text-anchor="middle" font-size="9" fill="#bbf7d0">new products</text>
  <text x="310" y="262" text-anchor="middle" font-size="9" fill="#374151">⑥ Pellets used to</text>
  <text x="310" y="274" text-anchor="middle" font-size="9" fill="#374151">make new goods</text>

  <!-- Arrow left from Manufacturing -->
  <line x1="258" y1="222" x2="182" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box 7: New Products -->
  <rect x="80" y="198" width="100" height="48" fill="#0891b2" rx="6"/>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">NEW</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">PRODUCTS</text>
  <text x="130" y="262" text-anchor="middle" font-size="9" fill="#374151">⑦ Bottles, bags,</text>
  <text x="130" y="274" text-anchor="middle" font-size="9" fill="#374151">clothing, furniture</text>

  <!-- Contaminated waste branch (dashed red) -->
  <line x1="210" y1="94" x2="210" y2="310" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <rect x="155" y="310" width="110" height="38" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" rx="4"/>
  <text x="210" y="326" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">CONTAMINATED</text>
  <text x="210" y="340" text-anchor="middle" font-size="9" fill="#dc2626">waste → landfill</text>

  <!-- Bottom label -->
  <text x="340" y="382" text-anchor="middle" font-size="9" fill="#999">Flow: Collection → Sorting → Shredding → Melting → Testing → Manufacture → New Products</text>
</svg>
