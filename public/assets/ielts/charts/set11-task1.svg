<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif" role="img" aria-labelledby="set11-title set11-desc">
  <title id="set11-title">Daily water consumption per person in four cities, 2010 and 2023</title>
  <desc id="set11-desc">A grouped bar chart measured in litres. Los Angeles falls from 480 to 390 litres, Singapore from 155 to 140, Cape Town from 250 to 175, and Copenhagen from 185 to 160.</desc>
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Average Daily Water Consumption Per Capita — 2010 vs 2023 (litres)</text>

  <!-- Axes -->
  <line x1="100" y1="50" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis labels (0–500 litres, 270px / 500 = 0.54px per litre) -->
  <text x="92" y="324" text-anchor="end" font-size="10" fill="#666">0</text>
  <text x="92" y="270" text-anchor="end" font-size="10" fill="#666">100</text>
  <text x="92" y="216" text-anchor="end" font-size="10" fill="#666">200</text>
  <text x="92" y="162" text-anchor="end" font-size="10" fill="#666">300</text>
  <text x="92" y="108" text-anchor="end" font-size="10" fill="#666">400</text>
  <text x="92" y="54" text-anchor="end" font-size="10" fill="#666">500</text>

  <!-- Y gridlines -->
  <line x1="100" y1="270" x2="640" y2="270" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="216" x2="640" y2="216" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="162" x2="640" y2="162" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="108" x2="640" y2="108" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="54"  x2="640" y2="54"  stroke="#e5e7eb" stroke-width="1"/>

  <!-- Scale: y = 320 - val*0.54 -->

  <!-- Los Angeles: 2010=480, 2023=390 -->
  <rect x="118" y="61" width="32" height="259" fill="#3b82f6"/>
  <rect x="155" y="109" width="32" height="211" fill="#f97316"/>
  <text x="161" y="337" text-anchor="middle" font-size="9" fill="#374151">Los Angeles</text>

  <!-- Singapore: 2010=155, 2023=140 -->
  <rect x="238" y="236" width="32" height="84" fill="#3b82f6"/>
  <rect x="275" y="244" width="32" height="76" fill="#f97316"/>
  <text x="271" y="337" text-anchor="middle" font-size="9" fill="#374151">Singapore</text>

  <!-- Cape Town: 2010=250, 2023=175 -->
  <rect x="358" y="185" width="32" height="135" fill="#3b82f6"/>
  <rect x="395" y="226" width="32" height="95" fill="#f97316"/>
  <text x="391" y="337" text-anchor="middle" font-size="9" fill="#374151">Cape Town</text>

  <!-- Copenhagen: 2010=185, 2023=160 -->
  <rect x="478" y="220" width="32" height="100" fill="#3b82f6"/>
  <rect x="515" y="234" width="32" height="86" fill="#f97316"/>
  <text x="511" y="337" text-anchor="middle" font-size="9" fill="#374151">Copenhagen</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="22" text-anchor="middle" font-size="11" fill="#374151">Litres per person per day</text>

  <!-- Legend -->
  <rect x="240" y="362" width="14" height="12" fill="#3b82f6" rx="2"/>
  <text x="258" y="373" font-size="11" fill="#333">2010</text>
  <rect x="318" y="362" width="14" height="12" fill="#f97316" rx="2"/>
  <text x="336" y="373" font-size="11" fill="#333">2023</text>
</svg>
