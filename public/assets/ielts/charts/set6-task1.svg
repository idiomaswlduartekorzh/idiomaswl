<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Home internet access in five Bellmere districts, 2000 to 2022</title>
  <desc id="desc">A line graph showing rising household internet access in the Central, North, Riverside, East and South districts. Central remains highest and South remains lowest throughout.</desc>
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Bellmere households with home internet access, 2000–2022</text>
  <text x="18" y="210" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90,18,210)">% of households</text>

  <!-- Grid + axes -->
  <line x1="70" y1="50" x2="70" y2="320" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="320" x2="640" y2="320" stroke="#ccc" stroke-width="1"/>
  <line x1="70" y1="50" x2="640" y2="50" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="102" x2="640" y2="102" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="154" x2="640" y2="154" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="206" x2="640" y2="206" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="258" x2="640" y2="258" stroke="#eee" stroke-width="1" stroke-dasharray="4"/>

  <!-- Y labels -->
  <text x="64" y="324" text-anchor="end" font-size="10" fill="#666">0%</text>
  <text x="64" y="262" text-anchor="end" font-size="10" fill="#666">20%</text>
  <text x="64" y="210" text-anchor="end" font-size="10" fill="#666">40%</text>
  <text x="64" y="158" text-anchor="end" font-size="10" fill="#666">60%</text>
  <text x="64" y="106" text-anchor="end" font-size="10" fill="#666">80%</text>
  <text x="64" y="54" text-anchor="end" font-size="10" fill="#666">100%</text>

  <!-- X labels: 2000, 2004, 2008, 2012, 2016, 2020, 2022 -->
  <text x="70" y="337" text-anchor="middle" font-size="10" fill="#666">2000</text>
  <text x="163" y="337" text-anchor="middle" font-size="10" fill="#666">2004</text>
  <text x="256" y="337" text-anchor="middle" font-size="10" fill="#666">2008</text>
  <text x="350" y="337" text-anchor="middle" font-size="10" fill="#666">2012</text>
  <text x="443" y="337" text-anchor="middle" font-size="10" fill="#666">2016</text>
  <text x="536" y="337" text-anchor="middle" font-size="10" fill="#666">2020</text>
  <text x="610" y="337" text-anchor="middle" font-size="10" fill="#666">2022</text>

  <!-- Central district -->
  <polyline points="70,206 163,196 256,172 350,154 443,132 536,116 610,111" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- North district -->
  <polyline points="70,258 163,224 256,196 350,184 443,164 536,132 610,122" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Riverside district -->
  <polyline points="70,314 163,291 256,264 350,214 443,188 536,168 610,158" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- East district -->
  <polyline points="70,319 163,302 256,278 350,244 443,210 536,186 610,176" fill="none" stroke="#c8202e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- South district -->
  <polyline points="70,321 163,319 256,308 350,290 443,258 536,236 610,214" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Legend -->
  <line x1="82" y1="362" x2="100" y2="362" stroke="#2563eb" stroke-width="2.5"/>
  <text x="104" y="366" font-size="11" fill="#333">Central</text>
  <line x1="200" y1="362" x2="218" y2="362" stroke="#16a34a" stroke-width="2.5"/>
  <text x="222" y="366" font-size="11" fill="#333">North</text>
  <line x1="280" y1="362" x2="298" y2="362" stroke="#d97706" stroke-width="2.5"/>
  <text x="302" y="366" font-size="11" fill="#333">Riverside</text>
  <line x1="398" y1="362" x2="416" y2="362" stroke="#c8202e" stroke-width="2.5"/>
  <text x="420" y="366" font-size="11" fill="#333">East</text>
  <line x1="507" y1="362" x2="525" y2="362" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="529" y="366" font-size="11" fill="#333">South</text>
</svg>
