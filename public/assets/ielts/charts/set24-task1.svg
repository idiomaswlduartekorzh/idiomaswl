<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Remanufacturing used wool insulation into new panels</title><desc id="desc">The process begins with collection of used wool insulation. It then moves through manual sorting, shredding and opening of the fibres, washing and degreasing, drying, carding, blending with binder, pressing into panels, quality control and dispatch. During manual sorting, contaminants are removed through a separate terminal exit and do not return to the process. At quality control, panels are checked for density and uniformity. Panels that pass move to dispatch, while panels that fail return to the carding stage and repeat the later stages.</desc>
  <rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H270 L40 270 Z" fill="#F2EEFA"/><path d="M1560 960 H1330 L1560 730 Z" fill="#F2EEFA"/><rect x="40" y="40" width="1520" height="920" rx="12" fill="none" stroke="#17324D" stroke-width="5"/>
  <g font-family="Arial, Helvetica, sans-serif"><defs><marker id="arrow-main" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#17324D"/></marker><marker id="arrow-exit" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#B33A3A"/></marker><marker id="arrow-loop" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#2D6F9F"/></marker></defs><text x="800" y="100" text-anchor="middle" font-size="42" font-weight="700" fill="#17324D">Remanufacturing used wool insulation into new panels</text><text x="800" y="148" text-anchor="middle" font-size="27" fill="#40566D">Arrows show material flow; stage numbers indicate order only</text><polyline points="330,276 385,276" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="605,276 660,276" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="880,276 935,276" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="1155,276 1210,276" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="1320,332 1320,555" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="1210,611 1155,611" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="935,611 880,611" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="660,611 605,611" fill="none" stroke="#17324D" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><polyline points="385,611 330,611" fill="none" stroke="#3F7D5A" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow-main)"/><rect x="337" y="566" width="42" height="30" rx="5" fill="#FFFFFF"/><text x="358" y="588" text-anchor="middle" font-size="17" font-weight="700" fill="#3F7D5A">PASS</text><polyline points="495,332 495,415" fill="none" stroke="#B33A3A" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow-exit)"/><rect x="390" y="350" width="210" height="34" rx="5" fill="#FFFFFF"/><text x="495" y="376" text-anchor="middle" font-size="20" font-weight="700" fill="#B33A3A">CONTAMINANTS</text><polyline points="495,667 495,750 1320,750 1320,667" fill="none" stroke="#2D6F9F" stroke-width="5" stroke-dasharray="18 8 4 8" marker-end="url(#arrow-loop)"/><rect x="650" y="720" width="330" height="34" rx="5" fill="#FFFFFF"/><text x="815" y="746" text-anchor="middle" font-size="20" font-weight="700" fill="#2D6F9F">FAIL: RETURN FOR RE-CARDING</text><g><rect x="110" y="220" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="140" cy="250" r="20" fill="#17324D"/><text x="140" y="259" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">1</text><text x="220" y="289" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="220" dy="0">Collection</tspan></text></g><g><rect x="385" y="220" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="415" cy="250" r="20" fill="#17324D"/><text x="415" y="259" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">2</text><text x="495" y="278" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="495" dy="0">Manual</tspan><tspan x="495" dy="31">sorting</tspan></text></g><g><rect x="660" y="220" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="690" cy="250" r="20" fill="#17324D"/><text x="690" y="259" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">3</text><text x="770" y="278" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="770" dy="0">Shredding</tspan><tspan x="770" dy="31">and opening</tspan></text></g><g><rect x="935" y="220" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="965" cy="250" r="20" fill="#17324D"/><text x="965" y="259" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">4</text><text x="1045" y="278" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="1045" dy="0">Washing and</tspan><tspan x="1045" dy="31">degreasing</tspan></text></g><g><rect x="1210" y="220" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="1240" cy="250" r="20" fill="#17324D"/><text x="1240" y="259" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">5</text><text x="1320" y="289" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="1320" dy="0">Drying</tspan></text></g><g><rect x="1210" y="555" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="1240" cy="585" r="20" fill="#17324D"/><text x="1240" y="594" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">6</text><text x="1320" y="624" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="1320" dy="0">Carding</tspan></text></g><g><rect x="935" y="555" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="965" cy="585" r="20" fill="#17324D"/><text x="965" y="594" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">7</text><text x="1045" y="613" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="1045" dy="0">Blending</tspan><tspan x="1045" dy="31">with binder</tspan></text></g><g><rect x="660" y="555" width="220" height="112" rx="16" fill="#EEF3F8" stroke="#17324D" stroke-width="4"/><circle cx="690" cy="585" r="20" fill="#17324D"/><text x="690" y="594" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">8</text><text x="770" y="613" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="770" dy="0">Pressing into</tspan><tspan x="770" dy="31">panels</tspan></text></g><g><rect x="385" y="555" width="220" height="112" rx="16" fill="#F7E3E3" stroke="#17324D" stroke-width="4"/><circle cx="415" cy="585" r="20" fill="#17324D"/><text x="415" y="594" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">9</text><text x="495" y="613" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="495" dy="0">Quality</tspan><tspan x="495" dy="31">control</tspan></text></g><g><rect x="110" y="555" width="220" height="112" rx="16" fill="#E7F3EC" stroke="#17324D" stroke-width="4"/><circle cx="140" cy="585" r="20" fill="#17324D"/><text x="140" y="594" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">10</text><text x="220" y="624" text-anchor="middle" font-size="27" font-weight="700" fill="#17324D"><tspan x="220" dy="0">Dispatch</tspan></text></g><rect x="320" y="415" width="350" height="86" rx="16" fill="#FFF5F5" stroke="#B33A3A" stroke-width="4" stroke-dasharray="10 7"/><text x="495" y="469" text-anchor="middle" font-size="26" font-weight="700" fill="#B33A3A">Rejected contaminants</text><g font-size="21" fill="#17324D"><line x1="880" y1="820" x2="940" y2="820" stroke="#17324D" stroke-width="5"/><text x="955" y="828">Main process / pass route</text><line x1="880" y1="855" x2="940" y2="855" stroke="#B33A3A" stroke-width="5" stroke-dasharray="10 7"/><text x="955" y="863">Rejected contaminants</text><line x1="1205" y1="855" x2="1265" y2="855" stroke="#2D6F9F" stroke-width="5" stroke-dasharray="18 8 4 8"/><text x="1280" y="863">Failed panel return</text></g><text x="80" y="920" font-size="20" fill="#40566D">Source: self-authored synthetic process for WeLearn Original Practice</text><text x="1520" y="920" t