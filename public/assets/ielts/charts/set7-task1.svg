<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif">
  <title id="title">Household waste composition in Alderwick and Brenton, 2025</title>
  <desc id="desc">Two stacked horizontal bars compare food, paper and card, plastic, glass and other waste. Alderwick is 38, 27, 18, 10 and 7 percent; Brenton is 29, 22, 25, 16 and 8 percent.</desc>
  <rect width="900" height="520" rx="18" fill="#ffffff"/>
  <text x="450" y="54" text-anchor="middle" font-size="25" font-weight="700" fill="#172554">Household waste by material, 2025</text>
  <text x="450" y="82" text-anchor="middle" font-size="15" fill="#52607a">Percentage of total collected weight</text>
  <g stroke="#d9e0ee" stroke-width="1">
    <line x1="150" y1="120" x2="150" y2="380"/><line x1="290" y1="120" x2="290" y2="380"/>
    <line x1="430" y1="120" x2="430" y2="380"/><line x1="570" y1="120" x2="570" y2="380"/>
    <line x1="710" y1="120" x2="710" y2="380"/><line x1="850" y1="120" x2="850" y2="380"/>
  </g>
  <g fill="#52607a" font-size="14" text-anchor="middle">
    <text x="150" y="405">0%</text><text x="290" y="405">20%</text><text x="430" y="405">40%</text>
    <text x="570" y="405">60%</text><text x="710" y="405">80%</text><text x="850" y="405">100%</text>
  </g>
  <text x="130" y="190" text-anchor="end" font-size="18" font-weight="700" fill="#172554">Alderwick</text>
  <rect x="150" y="145" width="266" height="70" fill="#287f6f"/><rect x="416" y="145" width="189" height="70" fill="#d3931b"/>
  <rect x="605" y="145" width="126" height="70" fill="#3157ad"/><rect x="731" y="145" width="70" height="70" fill="#a34c71"/>
  <rect x="801" y="145" width="49" height="70" fill="#697386"/>
  <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="283" y="187">38%</text><text x="510.5" y="187">27%</text><text x="668" y="187">18%</text>
    <text x="766" y="187">10%</text><text x="825.5" y="187">7%</text>
  </g>
  <text x="130" y="310" text-anchor="end" font-size="18" font-weight="700" fill="#172554">Brenton</text>
  <rect x="150" y="265" width="203" height="70" fill="#287f6f"/><rect x="353" y="265" width="154" height="70" fill="#d3931b"/>
  <rect x="507" y="265" width="175" height="70" fill="#3157ad"/><rect x="682" y="265" width="112" height="70" fill="#a34c71"/>
  <rect x="794" y="265" width="56" height="70" fill="#697386"/>
  <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
    <text x="251.5" y="307">29%</text><text x="430" y="307">22%</text><text x="594.5" y="307">25%</text>
    <text x="738" y="307">16%</text><text x="822" y="307">8%</text>
  </g>
  <g font-size="14" fill="#263450">
    <rect x="180" y="450" width="18" height="18" rx="3" fill="#287f6f"/><text x="207" y="464">Food</text>
    <rect x="290" y="450" width="18" height="18" rx="3" fill="#d3931b"/><text x="317" y="464">Paper and card</text>
    <rect x="460" y="450" width="18" height="18" rx="3" fill="#3157ad"/><text x="487" y="464">Plastic</text>
    <rect x="570" y="450" width="18" height="18" rx="3" fill="#a34c71"/><text x="597" y="464">Glass</text>
    <rect x="675" y="450" width="18" height="18" rx="3" fill="#697386"/><text x="702" y="464">Other</text>
  </g>
</svg>
