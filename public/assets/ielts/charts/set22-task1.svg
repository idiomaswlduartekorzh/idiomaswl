<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Weekly outcomes in a municipal appliance repair programme</title><desc id="desc">A table compares 40 kettles, 50 vacuum cleaners, 40 toasters and 50 washing machines. Immediate repairs are 30, 28, 26 and 18 respectively; workshop or parts outcomes are 6, 16, 8 and 24; not repaired outcomes are 4, 6, 6 and 8. Row percentages sum to 100 percent.</desc>
  <rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H270 L40 270 Z" fill="#F2EEFA"/><path d="M1560 960 H1330 L1560 730 Z" fill="#F2EEFA"/><rect x="40" y="40" width="1520" height="920" rx="12" fill="none" stroke="#17324D" stroke-width="5"/>
