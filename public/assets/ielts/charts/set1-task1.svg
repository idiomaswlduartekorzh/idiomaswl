<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Average daily household electricity use in Westhaven by purpose and season</title>
  <desc id="description">Grouped bar chart comparing winter and summer electricity use in kilowatt-hours for heating or cooling, water heating, cooking, lighting and other uses in 2025.</desc>
  <rect width="760" height="440" rx="10" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#18233f">Average daily household electricity use in Westhaven, 2025</text>
  <text x="20" y="220" text-anchor="middle" font-size="11" fill="#52617d" transform="rotate(-90 20 220)">Kilowatt-hours per household</text>

  <line x1="75" y1="50" x2="75" y2="350" stroke="#78849b"/>
  <line x1="75" y1="350" x2="725" y2="350" stroke="#78849b"/>
  <g stroke="#dde2eb" stroke-dasharray="4 4">
    <line x1="75" y1="290" x2="725" y2="290"/>
    <line x1="75" y1="230" x2="725" y2="230"/>
    <line x1="75" y1="170" x2="725" y2="170"/>
    <line x1="75" y1="110" x2="725" y2="110"/>
    <line x1="75" y1="50" x2="725" y2="50"/>
  </g>
  <g text-anchor="end" font-size="10" fill="#52617d">
    <text x="68" y="354">0</text>
    <text x="68" y="294">2</text>
    <text x="68" y="234">4</text>
    <text x="68" y="174">6</text>
    <text x="68" y="114">8</text>
    <text x="68" y="54">10</text>
  </g>

  <g fill="#2448a5">
    <rect x="105" y="74" width="34" height="276" rx="3"/>
    <rect x="235" y="182" width="34" height="168" rx="3"/>
    <rect x="365" y="269" width="34" height="81" rx="3"/>
    <rect x="495" y="236" width="34" height="114" rx="3"/>
    <rect x="625" y="218" width="34" height="132" rx="3"/>
  </g>
  <g fill="#d5525f">
    <rect x="143" y="146" width="34" height="204" rx="3"/>
    <rect x="273" y="227" width="34" height="123" rx="3"/>
    <rect x="403" y="278" width="34" height="72" rx="3"/>
    <rect x="533" y="293" width="34" height="57" rx="3"/>
    <rect x="663" y="209" width="34" height="141" rx="3"/>
  </g>

  <g text-anchor="middle" font-size="10" fill="#293652">
    <text x="141" y="370"><tspan x="141">Heating /</tspan><tspan x="141" dy="13">cooling</tspan></text>
    <text x="271" y="370"><tspan x="271">Water</tspan><tspan x="271" dy="13">heating</tspan></text>
    <text x="401" y="370">Cooking</text>
    <text x="531" y="370">Lighting</text>
    <text x="661" y="370">Other</text>
  </g>

  <rect x="275" y="414" width="16" height="11" rx="2" fill="#2448a5"/>
  <text x="297" y="424" font-size="11" fill="#293652">Winter</text>
  <rect x="385" y="414" width="16" height="11" rx="2" fill="#d5525f"/>
  <text x="407" y="424" font-size="11" fill="#293652">Summer</text>
</svg>
