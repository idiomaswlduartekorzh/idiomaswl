<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="chart-title chart-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">Global installed renewable power capacity by technology in 2015 and 2022</title>
  <desc id="chart-desc">Grouped bar chart in gigawatts. Hydropower rose from 1,209 to 1,256; wind from 432 to 899; solar from 227 to 1,053; and other renewables from 118 to 165.</desc>
  <rect width="760" height="460" rx="10" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#172554">Global installed renewable power capacity</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#475569">Capacity at year end (GW)</text>
  <g stroke="#dbe3ef" stroke-width="1">
    <line x1="94" y1="360" x2="724" y2="360"/><line x1="94" y1="296" x2="724" y2="296"/>
    <line x1="94" y1="231" x2="724" y2="231"/><line x1="94" y1="167" x2="724" y2="167"/>
    <line x1="94" y1="103" x2="724" y2="103"/><line x1="94" y1="60" x2="724" y2="60"/>
  </g>
  <g fill="#475569" font-size="11" text-anchor="end">
    <text x="84" y="364">0</text><text x="84" y="300">300</text><text x="84" y="235">600</text>
    <text x="84" y="171">900</text><text x="84" y="107">1,200</text><text x="84" y="64">1,400</text>
  </g>
  <line x1="94" y1="60" x2="94" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="94" y1="360" x2="724" y2="360" stroke="#334155" stroke-width="1.5"/>
  <text transform="rotate(-90 22 210)" x="22" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Gigawatts (GW)</text>
  <g>
    <rect x="132" y="101" width="42" height="259" rx="2" fill="#233876"/><rect x="178" y="91" width="42" height="269" rx="2" fill="#e5a52f"/>
    <text x="153" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#233876">1,209</text><text x="199" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#9a5f00">1,256</text>
    <rect x="286" y="267" width="42" height="93" rx="2" fill="#233876"/><rect x="332" y="167" width="42" height="193" rx="2" fill="#e5a52f"/>
    <text x="307" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#233876">432</text><text x="353" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#9a5f00">899</text>
    <rect x="440" y="311" width="42" height="49" rx="2" fill="#233876"/><rect x="486" y="134" width="42" height="226" rx="2" fill="#e5a52f"/>
    <text x="461" y="304" text-anchor="middle" font-size="10" font-weight="700" fill="#233876">227</text><text x="507" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#9a5f00">1,053</text>
    <rect x="594" y="335" width="42" height="25" rx="2" fill="#233876"/><rect x="640" y="325" width="42" height="35" rx="2" fill="#e5a52f"/>
    <text x="615" y="328" text-anchor="middle" font-size="10" font-weight="700" fill="#233876">118</text><text x="661" y="318" text-anchor="middle" font-size="10" font-weight="700" fill="#9a5f00">165</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">
    <text x="176" y="382">Hydropower</text><text x="330" y="382">Wind</text><text x="484" y="382">Solar</text><text x="638" y="382">Other*</text>
  </g>
  <g font-size="11" fill="#334155">
    <rect x="276" y="403" width="14" height="14" rx="2" fill="#233876"/><text x="297" y="414">2015</text>
    <rect x="365" y="403" width="14" height="14" rx="2" fill="#e5a52f"/><text x="386" y="414">2022</text>
  </g>
  <text x="380" y="441" text-anchor="middle" font-size="9.5" fill="#64748b">* Bioenergy, geothermal and marine energy; figures rounded to the nearest GW. Source: IRENA.</text>
</svg>
