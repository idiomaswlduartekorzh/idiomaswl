<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Global Installed Renewable Energy Capacity by Type — 2010, 2015, 2022 (GW)</text>

  <!-- Axes -->
  <line x1="100" y1="50" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis labels 0–2000 GW (270px / 2000 = 0.135px per GW) -->
  <text x="92" y="324" text-anchor="end" font-size="10" fill="#666">0</text>
  <text x="92" y="256" text-anchor="end" font-size="10" fill="#666">500</text>
  <text x="92" y="188" text-anchor="end" font-size="10" fill="#666">1000</text>
  <text x="92" y="120" text-anchor="end" font-size="10" fill="#666">1500</text>
  <text x="92" y="52"  text-anchor="end" font-size="10" fill="#666">2000</text>

  <!-- Y gridlines -->
  <line x1="100" y1="256" x2="640" y2="256" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="188" x2="640" y2="188" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="120" x2="640" y2="120" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="52"  x2="640" y2="52"  stroke="#e5e7eb" stroke-width="1"/>

  <!-- Scale: y = 320 - val*0.135 -->

  <!-- Hydropower: 2010=1010, 2015=1246, 2022=1392 -->
  <rect x="112" y="183" width="28" height="137" fill="#2563eb"/>
  <rect x="144" y="151" width="28" height="169" fill="#60a5fa"/>
  <rect x="176" y="132" width="28" height="188" fill="#93c5fd"/>
  <text x="165" y="337" text-anchor="middle" font-size="9" fill="#374151">Hydro</text>

  <!-- Wind: 2010=198, 2015=433, 2022=899 -->
  <rect x="252" y="293" width="28" height="27" fill="#2563eb"/>
  <rect x="284" y="261" width="28" height="59" fill="#60a5fa"/>
  <rect x="316" y="199" width="28" height="121" fill="#93c5fd"/>
  <text x="300" y="337" text-anchor="middle" font-size="9" fill="#374151">Wind</text>

  <!-- Solar PV: 2010=40, 2015=227, 2022=1053 -->
  <rect x="392" y="315" width="28" height="5"   fill="#2563eb"/>
  <rect x="424" y="289" width="28" height="31"  fill="#60a5fa"/>
  <rect x="456" y="178" width="28" height="142" fill="#93c5fd"/>
  <text x="440" y="337" text-anchor="middle" font-size="9" fill="#374151">Solar PV</text>

  <!-- Other (Bio+Geo): 2010=67, 2015=112, 2022=178 -->
  <rect x="532" y="311" width="28" height="9"  fill="#2563eb"/>
  <rect x="564" y="305" width="28" height="15" fill="#60a5fa"/>
  <rect x="596" y="296" width="28" height="24" fill="#93c5fd"/>
  <text x="580" y="337" text-anchor="middle" font-size="9" fill="#374151">Other</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="22" text-anchor="middle" font-size="11" fill="#374151">Installed capacity (GW)</text>

  <!-- Legend -->
  <rect x="165" y="360" width="14" height="12" fill="#2563eb" rx="2"/>
  <text x="183" y="371" font-size="11" fill="#333">2010</text>
  <rect x="238" y="360" width="14" height="12" fill="#60a5fa" rx="2"/>
  <text x="256" y="371" font-size="11" fill="#333">2015</text>
  <rect x="310" y="360" width="14" height="12" fill="#93c5fd" rx="2"/>
  <text x="328" y="371" font-size="11" fill="#333">2022</text>
</svg>
