<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="system-ui,sans-serif">
  <rect width="680" height="380" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">How Solar Panels Generate and Distribute Electricity</text>

  <!-- Sun -->
  <circle cx="80" cy="80" r="32" fill="#fbbf24" opacity="0.9"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" fill="#78350f" font-weight="700">SUN</text>
  <!-- Sun rays -->
  <line x1="80" y1="42" x2="80" y2="30" stroke="#fbbf24" stroke-width="2"/>
  <line x1="113" y1="80" x2="125" y2="80" stroke="#fbbf24" stroke-width="2"/>
  <line x1="103" y1="57" x2="112" y2="48" stroke="#fbbf24" stroke-width="2"/>
  <line x1="57" y1="57" x2="48" y2="48" stroke="#fbbf24" stroke-width="2"/>
  <line x1="47" y1="80" x2="35" y2="80" stroke="#fbbf24" stroke-width="2"/>

  <!-- Arrow: sun → solar panels -->
  <line x1="115" y1="90" x2="175" y2="110" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Solar panel array -->
  <rect x="180" y="100" width="120" height="70" fill="#1d4ed8" rx="4"/>
  <line x1="180" y1="123" x2="300" y2="123" stroke="#93c5fd" stroke-width="1"/>
  <line x1="180" y1="147" x2="300" y2="147" stroke="#93c5fd" stroke-width="1"/>
  <line x1="220" y1="100" x2="220" y2="170" stroke="#93c5fd" stroke-width="1"/>
  <line x1="260" y1="100" x2="260" y2="170" stroke="#93c5fd" stroke-width="1"/>
  <text x="240" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Solar Panels</text>
  <text x="240" y="202" text-anchor="middle" font-size="10" fill="#666">generate DC electricity</text>

  <!-- Arrow: panels → inverter -->
  <line x1="305" y1="135" x2="365" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="335" y="128" text-anchor="middle" font-size="9" fill="#666">DC</text>

  <!-- Inverter -->
  <rect x="368" y="112" width="80" height="46" fill="#374151" rx="6"/>
  <text x="408" y="133" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">INVERTER</text>
  <text x="408" y="148" text-anchor="middle" font-size="9" fill="#9ca3af">DC → AC</text>
  <text x="408" y="172" text-anchor="middle" font-size="10" fill="#666">converts to AC</text>

  <!-- Arrow: inverter → distribution box -->
  <line x1="450" y1="135" x2="510" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="128" text-anchor="middle" font-size="9" fill="#666">AC</text>

  <!-- Distribution box -->
  <rect x="512" y="110" width="80" height="50" fill="#6b7280" rx="6"/>
  <text x="552" y="133" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">METER &amp;</text>
  <text x="552" y="147" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">FUSE BOX</text>
  <text x="552" y="173" text-anchor="middle" font-size="10" fill="#666">distribution</text>

  <!-- Arrow down: → Home -->
  <line x1="552" y1="163" x2="552" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Home -->
  <polygon points="520,265 584,265 584,310 520,310" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <polygon points="508,270 596,270 552,238" fill="#d97706"/>
  <rect x="536" y="285" width="14" height="25" fill="#92400e" rx="1"/>
  <text x="552" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">HOME USE</text>

  <!-- Arrow left: → Grid -->
  <line x1="512" y1="140" x2="440" y2="270" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr2)"/>
  <text x="445" y="210" font-size="9" fill="#16a34a">excess</text>

  <!-- Grid -->
  <rect x="340" y="262" width="90" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="6"/>
  <text x="385" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">NATIONAL</text>
  <text x="385" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">GRID</text>
  <text x="385" y="312" text-anchor="middle" font-size="9" fill="#16a34a">surplus exported</text>

  <!-- Battery storage -->
  <rect x="175" y="262" width="90" height="55" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" rx="6"/>
  <text x="220" y="283" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">BATTERY</text>
  <text x="220" y="296" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">STORAGE</text>
  <text x="220" y="312" text-anchor="middle" font-size="9" fill="#7c3aed">stores surplus</text>
  <line x1="240" y1="170" x2="220" y2="262" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr3)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#374151"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Step labels -->
  <text x="340" y="360" text-anchor="middle" font-size="10" fill="#999">① Sunlight → ② Solar Panels (DC) → ③ Inverter (AC) → ④ Meter/Fuse Box → ⑤ Home / Grid / Battery</text>
</svg>
