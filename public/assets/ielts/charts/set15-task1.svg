<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" font-family="system-ui,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Electricity generation in the United Kingdom and Australia, 2022</title>
  <desc id="desc">Two pie charts based on official 2022 statistics. The United Kingdom generated 38.5 percent from gas, 28.9 percent from wind and solar, 14.6 percent from nuclear, 12.8 percent from other renewables, and 5.2 percent from coal, oil and other fuels. Australia generated 47 percent from coal, 32 percent from renewables, 19 percent from gas, and 2 percent from oil.</desc>
  <rect width="680" height="450" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Sources of electricity generation in 2022</text>
  <text x="340" y="47" text-anchor="middle" font-size="10" fill="#4b5563">percentage of total domestic generation</text>

  <text x="180" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">United Kingdom</text>
  <path d="M180,205 L180.00,90.00 A115,115 0 0,1 256.05,291.26 Z" fill="#f97316" stroke="#fff" stroke-width="2"/>
  <path d="M180,205 L256.05,291.26 A115,115 0 0,1 77.86,257.85 Z" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <path d="M180,205 L77.86,257.85 A115,115 0 0,1 75.94,156.04 Z" fill="#be123c" stroke="#fff" stroke-width="2"/>
  <path d="M180,205 L75.94,156.04 A115,115 0 0,1 143.09,96.08 Z" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <path d="M180,205 L143.09,96.08 A115,115 0 0,1 180.00,90.00 Z" fill="#6b7280" stroke="#fff" stroke-width="2"/>
  <text x="247" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Gas</text>
  <text x="247" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">38.5%</text>
  <text x="158" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Wind + solar</text>
  <text x="158" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">28.9%</text>
  <text x="108" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Nuclear</text>
  <text x="108" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">14.6%</text>
  <text x="134" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Other renew.</text>
  <text x="134" y="163" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">12.8%</text>

  <text x="500" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Australia</text>
  <path d="M500,205 L500.00,90.00 A115,115 0 0,1 521.55,317.96 Z" fill="#4b5563" stroke="#fff" stroke-width="2"/>
  <path d="M500,205 L521.55,317.96 A115,115 0 0,1 388.61,176.40 Z" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <path d="M500,205 L388.61,176.40 A115,115 0 0,1 485.59,90.91 Z" fill="#f97316" stroke="#fff" stroke-width="2"/>
  <path d="M500,205 L485.59,90.91 A115,115 0 0,1 500.00,90.00 Z" fill="#a855f7" stroke="#fff" stroke-width="2"/>
  <text x="578" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Coal</text>
  <text x="578" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">47%</text>
  <text x="450" y="258" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Renewables</text>
  <text x="450" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">32%</text>
  <text x="448" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Gas</text>
  <text x="448" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">19%</text>

  <rect x="52" y="344" width="12" height="12" fill="#6b7280" rx="2"/>
  <text x="70" y="354" font-size="9" fill="#374151">UK coal, oil &amp; other fuels: 5.2%</text>
  <rect x="52" y="366" width="12" height="12" fill="#a855f7" rx="2"/>
  <text x="70" y="376" font-size="9" fill="#374151">Australia oil: 2%</text>
  <text x="52" y="403" font-size="9" fill="#6b7280">UK categories are rounded to one decimal place.</text>
  <text x="52" y="420" font-size="9" fill="#6b7280">Sources: UK DESNZ electricity statistics; Australian Energy Statistics, Table O.</text>
</svg>
