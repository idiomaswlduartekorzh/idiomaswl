  <title id="visual-title">Production of acoustic wall panels from agricultural fibre and fungal mycelium</title><desc id="visual-desc">{&quot;family&quot;:&quot;process_diagram&quot;,&quot;title&quot;:&quot;Production of acoustic wall panels from agricultural fibre and fungal mycelium&quot;,&quot;unit&quot;:&quot;manufacturing stages&quot;,&quot;stages&quot;:[{&quot;id&quot;:1,&quot;label&quot;:&quot;clean and sterilise agricultural fibre&quot;},{&quot;id&quot;:2,&quot;label&quot;:&quot;cool fibre and add mycelium inoculum&quot;},{&quot;id&quot;:3,&quot;label&quot;:&quot;fill panel moulds&quot;},{&quot;id&quot;:4,&quot;label&quot;:&quot;grow under controlled temperature and humidity&quot;},{&quot;id&quot;:5,&quot;label&quot;:&quot;inspect density and surface growth&quot;},{&quot;id&quot;:6,&quot;label&quot;:&quot;return undergrown panels to controlled growth&quot;,&quot;conditional&quot;:true,&quot;returnsTo&quot;:4},{&quot;id&quot;:7,&quot;label&quot;:&quot;dry to stop growth&quot;},{&quot;id&quot;:8,&quot;label&quot;:&quot;trim and finish&quot;},{&quot;id&quot;:9,&quot;label&quot;:&quot;test acoustic performance&quot;},{&quot;id&quot;:10,&quot;label&quot;:&quot;package approved panels&quot;}],&quot;inputs&quot;:[&quot;agricultural fibre&quot;,&quot;mycelium inoculum&quot;,&quot;water and controlled heat&quot;],&quot;outputs&quot;:[&quot;approved acoustic wall panels&quot;],&quot;integrityRules&quot;:[&quot;single main left-to-right flow&quot;,&quot;one explicit quality-control return loop from stage 5 to stage 4&quot;,&quot;stage numbering and arrows unambiguous&quot;,&quot;no unsupported quantitative claims&quot;,&quot;alt text states every stage and branch&quot;]}</desc><defs>
