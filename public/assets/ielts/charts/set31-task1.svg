ext><text x="158" y="289" font-size="16" font-weight="500" fill="#17324D">sterilise</text><text x="158" y="310" font-size="16" font-weight="500" fill="#17324D">agricultural fibre</text></g><g data-stage="2" data-label="cool fibre and add mycelium inoculum"><rect x="380" y="240" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="408" cy="269" r="20" fill="#17324D"/><text x="408" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text><text x="438" y="268" font-size="16" font-weight="700" fill="#17324D">cool fibre and add</text><text x="438" y="289" font-size="16" font-weight="500" fill="#17324D">mycelium inoculum</text></g><g data-stage="3" data-label="fill panel moulds"><rect x="660" y="240" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="688" cy="269" r="20" fill="#17324D"/><text x="688" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text><text x="718" y="268" font-size="16" font-weight="700" fill="#17324D">fill panel moulds</text></g><g data-stage="4" data-label="grow under controlled temperature and humidity"><rect x="940" y="240" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="968" cy="269" r="20" fill="#17324D"/><text x="968" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text><text x="998" y="268" font-size="16" font-weight="700" fill="#17324D">grow under</text><text x="998" y="289" font-size="16" font-weight="500" fill="#17324D">controlled</text><text x="998" y="310" font-size="16" font-weight="500" fill="#17324D">temperature and</text><text x="998" y="331" font-size="16" font-weight="500" fill="#17324D">humidity</text></g><g data-stage="5" data-label="inspect density and surface growth"><rect x="1220" y="240" width="220" height="116" rx="12" fill="#FFF4E8" stroke="#17324D" stroke-width="3"/><circle cx="1248" cy="269" r="20" fill="#17324D"/><text x="1248" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text><text x="1278" y="268" font-size="16" font-weight="700" fill="#17324D">inspect density</text><text x="1278" y="289" font-size="16" font-weight="500" fill="#17324D">and surface growth</text></g><g data-stage="6" data-label="return undergrown panels to controlled growth"><rect x="1040" y="455" width="220" height="116" rx="12" fill="#FFF0EF" stroke="#17324D" stroke-width="3"/><circle cx="1068" cy="484" r="20" fill="#C64B45"/><text x="1068" y="492" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">6</text><text x="1098" y="483" font-size="16" font-weight="700" fill="#17324D">return undergrown</text><text x="1098" y="504" font-size="16" font-weight="500" fill="#17324D">panels to</text><text x="1098" y="525" font-size="16" font-weight="500" fill="#17324D">controlled growth</text></g><g data-stage="7" data-label="dry to stop growth"><rect x="1220" y="650" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="1248" cy="679" r="20" fill="#17324D"/><text x="1248" y="687" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">7</text><text x="1278" y="678" font-size="16" font-weight="700" fill="#17324D">dry to stop growth</text></g><g data-stage="8" data-label="trim and finish"><rect x="940" y="650" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="968" cy="679" r="20" fill="#17324D"/><text x="968" y="687" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">8</text><text x="998" y="678" font-size="16" font-weight="700" fill="#17324D">trim and finish</text></g><g data-stage="9" data-label="test acoustic performance"><rect x="660" y="650" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="688" cy="679" r="20" fill="#17324D"/><text x="688" y="687" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">9</text><text x="718" y="678" font-size="16" font-weight="700" fill="#17324D">test acoustic</text><text x="718" y="699" font-size="16" font-weight="500" fill="#17324D">performance</text></g><g data-stage="10" data-label="package approved panels"><rect x="380" y="650" width="220" height="116" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="408" cy="679" r="20" fill="#17324D"/><text x="408" y="687" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">10</text><text x="438" y="678" font-size="16" font-weight="700" fill="#17324D">package approved</text><text x="438" y="699" font-size="16" font-weight="500" fill="#17324D">panels</text></g>
