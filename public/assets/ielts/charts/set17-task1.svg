<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="chart-title chart-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="chart-title">Life expectancy at birth in five World Bank regions, 1990 and 2022</title>
  <desc id="chart-desc">Grouped bar chart in years. East Asia and Pacific rose from 68.3 to 76.7; Europe and Central Asia from 72.2 to 77.8; Latin America and Caribbean from 67.5 to 74.6; North America from 75.4 to 77.8; and Sub-Saharan Africa from 50.0 to 61.9.</desc>
  <rect width="800" height="500" rx="10" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#172554">Life expectancy at birth by World Bank region</text>
  <text x="400" y="49" text-anchor="middle" font-size="12" fill="#475569">Years</text>
  <g stroke="#dbe3ef" stroke-width="1">
    <line x1="88" y1="370" x2="760" y2="370"/><line x1="88" y1="295" x2="760" y2="295"/>
    <line x1="88" y1="220" x2="760" y2="220"/><line x1="88" y1="145" x2="760" y2="145"/>
    <line x1="88" y1="70" x2="760" y2="70"/>
  </g>
  <g fill="#475569" font-size="11" text-anchor="end">
    <text x="78" y="374">0</text><text x="78" y="299">20</text><text x="78" y="224">40</text>
    <text x="78" y="149">60</text><text x="78" y="74">80</text>
  </g>
  <line x1="88" y1="70" x2="88" y2="370" stroke="#334155" stroke-width="1.5"/>
  <line x1="88" y1="370" x2="760" y2="370" stroke="#334155" stroke-width="1.5"/>
  <text transform="rotate(-90 24 220)" x="24" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Life expectancy (years)</text>
  <g>
    <rect x="116" y="114" width="34" height="256" rx="2" fill="#21557c"/><rect x="154" y="82" width="34" height="288" rx="2" fill="#d97706"/>
    <text x="133" y="107" text-anchor="middle" font-size="10" font-weight="700" fill="#21557c">68.3</text><text x="171" y="75" text-anchor="middle" font-size="10" font-weight="700" fill="#9a4d00">76.7</text>
    <rect x="246" y="99" width="34" height="271" rx="2" fill="#21557c"/><rect x="284" y="78" width="34" height="292" rx="2" fill="#d97706"/>
    <text x="263" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#21557c">72.2</text><text x="301" y="71" text-anchor="middle" font-size="10" font-weight="700" fill="#9a4d00">77.8</text>
    <rect x="376" y="117" width="34" height="253" rx="2" fill="#21557c"/><rect x="414" y="90" width="34" height="280" rx="2" fill="#d97706"/>
    <text x="393" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#21557c">67.5</text><text x="431" y="83" text-anchor="middle" font-size="10" font-weight="700" fill="#9a4d00">74.6</text>
    <rect x="506" y="87" width="34" height="283" rx="2" fill="#21557c"/><rect x="544" y="78" width="34" height="292" rx="2" fill="#d97706"/>
    <text x="523" y="80" text-anchor="middle" font-size="10" font-weight="700" fill="#21557c">75.4</text><text x="561" y="71" text-anchor="middle" font-size="10" font-weight="700" fill="#9a4d00">77.8</text>
    <rect x="636" y="183" width="34" height="187" rx="2" fill="#21557c"/><rect x="674" y="138" width="34" height="232" rx="2" fill="#d97706"/>
    <text x="653" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="#21557c">50.0</text><text x="691" y="131" text-anchor="middle" font-size="10" font-weight="700" fill="#9a4d00">61.9</text>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e293b">
    <text x="152" y="390"><tspan x="152">East Asia &amp;</tspan><tspan x="152" dy="13">Pacific</tspan></text>
    <text x="282" y="390"><tspan x="282">Europe &amp;</tspan><tspan x="282" dy="13">Central Asia</tspan></text>
    <text x="412" y="390"><tspan x="412">Latin America &amp;</tspan><tspan x="412" dy="13">Caribbean</tspan></text>
    <text x="542" y="396">North America</text>
    <text x="672" y="390"><tspan x="672">Sub-Saharan</tspan><tspan x="672" dy="13">Africa</tspan></text>
  </g>
  <g font-size="11" fill="#334155">
    <rect x="318" y="425" width="14" height="14" rx="2" fill="#21557c"/><text x="339" y="436">1990</text>
    <rect x="407" y="425" width="14" height="14" rx="2" fill="#d97706"/><text x="428" y="436">2022</text>
  </g>
  <text x="400" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">Source: World Bank, indicator SP.DYN.LE00.IN; values rounded to one decimal.</text>
</svg>
