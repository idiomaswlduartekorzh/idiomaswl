<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Life Expectancy at Birth by World Region — 1990 vs 2022 (years)</text>

  <!-- Axes -->
  <line x1="110" y1="50" x2="110" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="320" x2="650" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis labels 40–85 (range=45, 270px / 45 = 6px per year) -->
  <text x="102" y="324" text-anchor="end" font-size="10" fill="#666">40</text>
  <text x="102" y="264" text-anchor="end" font-size="10" fill="#666">50</text>
  <text x="102" y="204" text-anchor="end" font-size="10" fill="#666">60</text>
  <text x="102" y="144" text-anchor="end" font-size="10" fill="#666">70</text>
  <text x="102" y="84"  text-anchor="end" font-size="10" fill="#666">80</text>
  <text x="102" y="54"  text-anchor="end" font-size="10" fill="#666">85</text>

  <!-- Y gridlines -->
  <line x1="110" y1="264" x2="650" y2="264" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="110" y1="204" x2="650" y2="204" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="110" y1="144" x2="650" y2="144" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="110" y1="84"  x2="650" y2="84"  stroke="#e5e7eb" stroke-width="1"/>

  <!-- Scale: y = 320 - (val - 40) * 6 -->

  <!-- Europe: 1990=74.2 → y=320-(34.2*6)=320-205=115; 2022=78.5 → y=320-231=89 -->
  <rect x="122" y="115" width="30" height="205" fill="#3b82f6"/>
  <rect x="156" y="89"  width="30" height="231" fill="#f97316"/>
  <text x="151" y="337" text-anchor="middle" font-size="9" fill="#374151">Europe</text>

  <!-- North America: 1990=75.4→y=106; 2022=77.2→y=95 -->
  <rect x="222" y="106" width="30" height="214" fill="#3b82f6"/>
  <rect x="256" y="95"  width="30" height="225" fill="#f97316"/>
  <text x="251" y="337" text-anchor="middle" font-size="9" fill="#374151">N. America</text>

  <!-- East Asia: 1990=70.0→y=140; 2022=77.8→y=91 -->
  <rect x="322" y="140" width="30" height="180" fill="#3b82f6"/>
  <rect x="356" y="91"  width="30" height="229" fill="#f97316"/>
  <text x="351" y="337" text-anchor="middle" font-size="9" fill="#374151">East Asia</text>

  <!-- Latin America: 1990=68.5→y=149; 2022=74.1→y=116 -->
  <rect x="422" y="149" width="30" height="171" fill="#3b82f6"/>
  <rect x="456" y="116" width="30" height="204" fill="#f97316"/>
  <text x="451" y="337" text-anchor="middle" font-size="9" fill="#374151">Lat. America</text>

  <!-- Sub-Saharan Africa: 1990=50.0→y=260; 2022=61.5→y=191 -->
  <rect x="522" y="260" width="30" height="60"  fill="#3b82f6"/>
  <rect x="556" y="191" width="30" height="129" fill="#f97316"/>
  <text x="551" y="337" text-anchor="middle" font-size="9" fill="#374151">Sub-Saharan</text>
  <text x="551" y="348" text-anchor="middle" font-size="9" fill="#374151">Africa</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="30" text-anchor="middle" font-size="11" fill="#374151">Life expectancy (years)</text>

  <!-- Legend -->
  <rect x="240" y="366" width="14" height="12" fill="#3b82f6" rx="2"/>
  <text x="258" y="377" font-size="11" fill="#333">1990</text>
  <rect x="318" y="366" width="14" height="12" fill="#f97316" rx="2"/>
  <text x="336" y="377" font-size="11" fill="#333">2022</text>
</svg>
