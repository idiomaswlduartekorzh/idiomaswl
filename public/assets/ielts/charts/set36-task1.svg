<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">How storm-felled urban trees are converted into civic benches</title><desc id="visual-desc">The process has nine ordered production stages. Storm-felled trees first undergo a safety inspection, then branch removal and log cutting, sawmilling into boards, kiln drying and a moisture check. Boards that pass continue to lamination, bench-part cutting, assembly and finishing, and installation. Boards that fail the moisture check leave the main process and terminate as mulch. The full numbered sequence and decision routes are listed below.</desc><defs>
  <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C64B45"/></marker>
  <pattern id="blue-lines" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#EAF3F8"/><path d="M0 4 H14 M0 11 H14" stroke="#2F6F9F" stroke-width="2"/></pattern>
  <pattern id="orange-grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF4E8"/><path d="M0 0 L12 12 M12 0 L0 12" stroke="#C26B1D" stroke-width="1.5"/></pattern>
  <pattern id="green-dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#EDF6EF"/><circle cx="3" cy="3" r="2" fill="#3F7D5A"/><circle cx="9" cy="9" r="2" fill="#3F7D5A"/></pattern>
  <pattern id="red-hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF0EF"/><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#C64B45" stroke-width="2"/></pattern>
</defs><rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H255 L40 255 Z" fill="#F4F1FB"/><path d="M1560 960 H1345 L1560 745 Z" fill="#F4F1FB"/><rect x="40" y="40" width="1520" height="920" rx="8" fill="none" stroke="#17324D" stroke-width="5"/><g font-family="Arial, Helvetica, sans-serif"><text x="800" y="110" text-anchor="middle" font-size="42" font-weight="700" fill="#17324D">From storm-felled urban trees to civic benches</text><text x="800" y="158" text-anchor="middle" font-size="27" fill="#40566D">Ordered production stages with one moisture decision</text><line x1="310" y1="296" x2="346" y2="296" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="580" y1="296" x2="616" y2="296" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="850" y1="296" x2="886" y2="296" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="1120" y1="296" x2="1156" y2="296" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="1170" y1="641" x2="1134" y2="641" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="900" y1="641" x2="864" y2="641" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><line x1="630" y1="641" x2="594" y2="641" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><path d="M1425 296 H1495 V641 H1404" fill="none" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="1460" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#17324D">PASS</text><g data-stage="1" data-label="safety inspection" data-shape="process-card"><rect x="90" y="240" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="118" cy="268" r="20" fill="#17324D"/><text x="118" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text><text x="148" y="271" font-size="17" font-weight="700" fill="#17324D">safety inspection</text></g><g data-stage="2" data-label="branch removal and log cutting" data-shape="process-card"><rect x="360" y="240" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="388" cy="268" r="20" fill="#17324D"/><text x="388" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text><text x="418" y="271" font-size="17" font-weight="700" fill="#17324D">branch removal and</text><text x="418" y="295" font-size="17" font-weight="500" fill="#17324D">log cutting</text></g><g data-stage="3" data-label="sawmill boards" data-shape="process-card"><rect x="630" y="240" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="658" cy="268" r="20" fill="#17324D"/><text x="658" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">3</text><text x="688" y="271" font-size="17" font-weight="700" fill="#17324D">sawmill boards</text></g><g data-stage="4" data-label="kiln drying" data-shape="process-card"><rect x="900" y="240" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="928" cy="268" r="20" fill="#17324D"/><text x="928" y="276" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">4</text><text x="958" y="271" font-size="17" font-weight="700" fill="#17324D">kiln drying</text></g><g data-stage="5" data-label="moisture check" data-shape="decision-diamond"><path d="M1280 220 L1425 296 L1280 372 L1135 296 Z" fill="#FFF4E8" stroke="#17324D" stroke-width="4"/><circle cx="1192" cy="261" r="20" fill="#17324D"/><text x="1192" y="269" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">5</text><text x="1280" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#17324D">moisture check</text></g><g data-stage="6" data-label="lamination" data-shape="process-card"><rect x="1170" y="585" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="1198" cy="613" r="20" fill="#17324D"/><text x="1198" y="621" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">6</text><text x="1228" y="616" font-size="17" font-weight="700" fill="#17324D">lamination</text></g><g data-stage="7" data-label="bench-part cutting" data-shape="process-card"><rect x="900" y="585" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="928" cy="613" r="20" fill="#17324D"/><text x="928" y="621" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">7</text><text x="958" y="616" font-size="17" font-weight="700" fill="#17324D">bench-part cutting</text></g><g data-stage="8" data-label="assembly and finishing" data-shape="process-card"><rect x="630" y="585" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="658" cy="613" r="20" fill="#17324D"/><text x="658" y="621" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">8</text><text x="688" y="616" font-size="17" font-weight="700" fill="#17324D">assembly and</text><text x="688" y="640" font-size="17" font-weight="500" fill="#17324D">finishing</text></g><g data-stage="9" data-label="installation" data-shape="process-card"><rect x="360" y="585" width="220" height="112" rx="12" fill="#F7F9FB" stroke="#17324D" stroke-width="3"/><circle cx="388" cy="613" r="20" fill="#17324D"/><text x="388" y="621" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">9</text><text x="418" y="616" font-size="17" font-weight="700" fill="#17324D">installation</text></g><path d="M1280 372 V440 H1090" fill="none" stroke="#C64B45" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)" data-route="moisture-fail"/><text x="1185" y="472" text-anchor="middle" font-size="16" fill="#A6322D" data-label-clearance="route-separated"><tspan x="1185" font-weight="700">FAIL</tspan><tspan x="1185" dy="20" font-weight="500">unsuitable boards</tspan></text><rect x="865" y="390" width="220" height="100" rx="50" fill="url(#red-hatch)" stroke="#C64B45" stroke-width="3" data-termination="mulch"/><text x="975" y="432" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">DIVERTED TO</text><text x="975" y="463" text-anchor="middle" font-size="23" font-weight="700" fill="#17324D">MULCH</text><g aria-label="Flow legend"><line x1="470" y1="825" x2="530" y2="825" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="550" y="833" font-size="20" fill="#17324D">main process / acceptable boards</text><line x1="910" y1="825" x2="970" y2="825" stroke="#C64B45" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)"/><text x="990" y="833" font-size="20" fill="#17324D">failed moisture check</text></g><text x="90" y="930" font-size="20" fill="#40566D">Source: author-created fictional timber process</text><text x="1510" y="930" text-anchor="end" font-size="21" font-weight="700" fill="#17324D">WeLearn Original Practice</text></g></svg>
