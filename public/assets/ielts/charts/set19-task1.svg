<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,sans-serif" role="img" aria-labelledby="title description">
  <title id="title">U.S. fourth-quarter retail e-commerce share, 2019 to 2024</title>
  <desc id="description">Line graph comparing seasonally adjusted and not adjusted e-commerce sales as percentages of total U.S. retail sales in the fourth quarter. Adjusted values are 11.4, 14.0, 12.9, 14.7, 15.6 and 16.4 percent. Not adjusted values are 12.8, 15.7, 14.5, 16.0, 17.1 and 17.9 percent.</desc>
  <rect width="680" height="420" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#172554">U.S. retail e-commerce sales in the fourth quarter</text>
  <text x="340" y="47" text-anchor="middle" font-size="11" fill="#475569">Percentage of total retail sales, 2019–2024</text>
  <line x1="82" y1="66" x2="82" y2="326" stroke="#334155" stroke-width="2"/>
  <line x1="82" y1="326" x2="628" y2="326" stroke="#334155" stroke-width="2"/>
  <g font-size="10" fill="#475569" text-anchor="end">
    <text x="72" y="330">0%</text><text x="72" y="265">5%</text><text x="72" y="200">10%</text>
    <text x="72" y="135">15%</text><text x="72" y="70">20%</text>
  </g>
  <g stroke="#dbe3ee" stroke-width="1">
    <line x1="82" y1="261" x2="628" y2="261"/><line x1="82" y1="196" x2="628" y2="196"/>
    <line x1="82" y1="131" x2="628" y2="131"/><line x1="82" y1="66" x2="628" y2="66"/>
  </g>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="92" y="344">2019</text><text x="196" y="344">2020</text><text x="300" y="344">2021</text>
    <text x="404" y="344">2022</text><text x="508" y="344">2023</text><text x="612" y="344">2024</text>
  </g>
  <polyline points="92,178 196,144 300,158 404,135 508,123 612,113" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="92,160 196,122 300,138 404,118 508,104 612,93" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 4"/>
  <g fill="#1d4ed8" stroke="#fff" stroke-width="1.5">
    <circle cx="92" cy="178" r="4"/><circle cx="196" cy="144" r="4"/><circle cx="300" cy="158" r="4"/>
    <circle cx="404" cy="135" r="4"/><circle cx="508" cy="123" r="4"/><circle cx="612" cy="113" r="4"/>
  </g>
  <g fill="#c2410c" stroke="#fff" stroke-width="1.5">
    <circle cx="92" cy="160" r="4"/><circle cx="196" cy="122" r="4"/><circle cx="300" cy="138" r="4"/>
    <circle cx="404" cy="118" r="4"/><circle cx="508" cy="104" r="4"/><circle cx="612" cy="93" r="4"/>
  </g>
  <g font-size="9" font-weight="600" text-anchor="middle">
    <g fill="#1d4ed8">
      <text x="92" y="193">11.4</text><text x="196" y="159">14.0</text><text x="300" y="173">12.9</text>
      <text x="404" y="150">14.7</text><text x="508" y="138">15.6</text><text x="612" y="128">16.4</text>
    </g>
    <g fill="#9a3412">
      <text x="92" y="151">12.8</text><text x="196" y="113">15.7</text><text x="300" y="129">14.5</text>
      <text x="404" y="109">16.0</text><text x="508" y="95">17.1</text><text x="612" y="84">17.9</text>
    </g>
  </g>
  <line x1="160" y1="369" x2="190" y2="369" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="175" cy="369" r="4" fill="#1d4ed8"/>
  <text x="198" y="373" font-size="10" fill="#334155">Seasonally adjusted</text>
  <line x1="348" y1="369" x2="378" y2="369" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="363" cy="369" r="4" fill="#c2410c"/>
  <text x="386" y="373" font-size="10" fill="#334155">Not adjusted</text>
  <text x="340" y="401" text-anchor="middle" font-size="9" fill="#64748b">Source: U.S. Census Bureau, Quarterly Retail E-Commerce Sales releases (Q4 2019–Q4 2024)</text>
</svg>
