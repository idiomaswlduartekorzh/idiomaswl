<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">Annual tomato yield and heating energy for four greenhouse coverings</title><desc id="visual-desc">The combined chart compares four greenhouse coverings. Tomato yield bars, measured in kilograms per square metre on the left axis, are 41, 49, 46, 38 for single glass, double glass, polycarbonate, inflated film respectively. Heating-energy line markers, measured in kilowatt-hours per square metre on the right axis, are 390, 275, 230, 180 in the same order. Both axes start at zero.</desc><defs>
  <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C64B45"/></marker>
  <pattern id="blue-lines" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#EAF3F8"/><path d="M0 4 H14 M0 11 H14" stroke="#2F6F9F" stroke-width="2"/></pattern>
  <pattern id="red-hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF0EF"/><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#C64B45" stroke-width="2"/></pattern>
