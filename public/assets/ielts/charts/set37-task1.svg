<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">The return and reuse cycle for refillable glass bottles</title><desc id="visual-desc">The process has a six-stage refill loop. Bottles move from customer return to depot sorting and an inspection gate. Bottles that pass inspection continue through caustic washing, refilling and capping, and retail redistribution before returning to the customer-return stage. Rejected bottles leave the refill loop for cullet collection and then terminate at glass remanufacture. No arrow returns from glass remanufacture to the refill loop.</desc><defs>
  <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C64B45"/></marker>
  <pattern id="blue-lines" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#EAF3F8"/><path d="M0 4 H14 M0 11 H14" stroke="#2F6F9F" stroke-width="2"/></pattern>
  <pattern id="red-hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF0EF"/><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#C64B45" stroke-width="2"/></pattern>
  <filter id="white-halo" x="-30%" y="-30%" width="160%" height="160%"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/><feFlood flood-color="#FFFFFF"/><feComposite in2="d" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H255 L40 255 Z" fill="#F4F1FB"/><path d="M1560 960 H1345 L1560 745 Z" fill="#F4F1FB"/><rect x="40" y="40" width="1520" height="920" rx="8" fill="none" stroke="#17324D" stroke-width="5"/><g font-family="Arial, Helvetica, sans-serif"><text x="800" y="112" text-anchor="middle" font-size="42" font-weight="700" fill="#17324D">The return and reuse cycle for refillable glass bottles</text><text x="800" y="160" text-anchor="middle" font-size="25" fill="#40566D">Six-stage refill loop with a separate terminal rejection route</text>
  <g aria-label="Main refill loop" fill="none" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"><path data-edge="return-sort" d="M265 500 H315"/><path data-edge="sort-inspect" d="M505 500 H575"/><path data-edge="inspect-wash" d="M725 466 C750 421 775 386 805 380"/><path data-edge="wash-fill" d="M995 380 H1045"/><path data-edge="fill-retail" d="M1235 380 C1260 386 1268 436 1275 466"/><path data-edge="retail-return" d="M1485 500 V225 H170 V441"/></g>
  <g data-node="return"><rect x="75" y="441" width="190" height="118" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><circle cx="109" cy="475" r="22" fill="#17324D"/><text x="109" y="483" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text><text x="170" y="521" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Customer return</text></g><g data-node="sort"><rect x="315" y="441" width="190" height="118" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><circle cx="349" cy="475" r="22" fill="#17324D"/><text x="349" y="483" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text><text x="410" y="521" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Depot sorting</text></g><g data-node="wash"><rect x="805" y="321" width="190" height="118" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><circle cx="839" cy="355" r="22" fill="#17324D"/><text x="839" y="363" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text><text x="900" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Caustic washing</text></g><g data-node="fill"><rect x="1045" y="321" width="190" height="118" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><circle cx="1079" cy="355" r="22" fill="#17324D"/><text x="1079" y="363" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">5</text><text x="1140" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Refill and cap</text></g><g data-node="retail"><rect x="1275" y="441" width="210" height="118" rx="12" fill="#FFFFFF" stroke="#17324D" stroke-width="4"/><circle cx="1309" cy="475" r="22" fill="#17324D"/><text x="1309" y="483" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">6</text><text x="1380" y="521" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Retail redistribution</text></g><g data-node="inspect" data-shape="decision"><path d="M650 405 L725 500 L650 595 L575 500 Z" fill="#FFF4E8" stroke="#17324D" stroke-width="4"/><circle cx="650" cy="459" r="22" fill="#17324D"/><text x="650" y="467" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text><text x="650" y="512" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">Inspection</text><text x="650" y="536" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">gate</text></g>
  <text x="762" y="416" font-size="18" font-weight="700" fill="#17324D">PASS</text><path data-edge="inspect-cullet" d="M650 595 V706" fill="none" stroke="#C64B45" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)"/><text x="672" y="662" font-size="18" font-weight="700" fill="#A6322D">FAIL</text>
  <g data-node="cullet"><rect x="535" y="706" width="230" height="108" rx="54" fill="url(#red-hatch)" stroke="#C64B45" stroke-width="4"/><text x="650" y="751" text-anchor="middle" font-size="18" font-weight="700" fill="#17324D">REJECTED BOTTLES</text><text x="650" y="784" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">Cullet collection</text></g>
  <g data-node="remanufacture" data-terminal="true"><rect x="770" y="706" width="260" height="108" rx="54" fill="#EAF3F8" stroke="#17324D" stroke-width="4"/><text x="900" y="751" text-anchor="middle" font-size="18" font-weight="700" fill="#17324D">TERMINAL EXIT</text><text x="900" y="784" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">Glass remanufacture</text></g>
  <path data-edge="cullet-remanufacture" data-contract-arrow-start="760,760" data-contract-arrow-end="850,760" data-rendered-arrow-start="760,734" data-rendered-arrow-end="850,706" d="M760 734 C785 697 815 674 850 674 V706" fill="none" stroke="#C64B45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
  <g aria-label="Flow legend"><line x1="1115" y1="710" x2="1180" y2="710" stroke="#17324D" stroke-width="5" marker-end="url(#arrow-navy)"/><text x="1200" y="718" font-size="19" fill="#17324D">refill loop</text><line x1="1115" y1="755" x2="1180" y2="755" stroke="#C64B45" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow-red)"/><text x="1200" y="763" font-size="19" fill="#17324D">rejection route</text></g>
  <text x="800" y="855" text-anchor="middle" font-size="19" font-weight="700" fill="#A6322D">The rejection route terminates at glass remanufacture and does not rejoin the refill loop.</text><text x="90" y="930" font-size="20" fill="#40566D">Source: author-created fictional process</text><text x="1510" y="930" text-anchor="end" font-size="21" font-weight="700" fill="#17324D">WeLearn Original Practice</text></g></svg>
