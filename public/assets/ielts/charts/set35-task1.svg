<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="visual-title visual-desc"><title id="visual-title">Mountain campsite before and after a proposal for winter use</title><desc id="visual-desc">The two maps have the same boundary and north-up orientation. The stream on the east, north-west tree belt and southern service-track entrance remain fixed. Before the proposal, parking is south-west beside the entrance, a tent meadow occupies the centre, a wash block stands east of the meadow, and a footpath connects these areas. Under the winter-use proposal, parking moves south-east, a winter hut occupies the central-west, a boardwalk connects parking, hut and wash block, snow storage replaces the old parking area, and the retained tent meadow is smaller and lies north of the hut. The feature ledgers below give every relationship.</desc><defs>
  <marker id="arrow-navy" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17324D"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C64B45"/></marker>
  <pattern id="blue-lines" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#EAF3F8"/><path d="M0 4 H14 M0 11 H14" stroke="#2F6F9F" stroke-width="2"/></pattern>
  <pattern id="orange-grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF4E8"/><path d="M0 0 L12 12 M12 0 L0 12" stroke="#C26B1D" stroke-width="1.5"/></pattern>
  <pattern id="green-dots" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#EDF6EF"/><circle cx="3" cy="3" r="2" fill="#3F7D5A"/><circle cx="9" cy="9" r="2" fill="#3F7D5A"/></pattern>
  <pattern id="red-hatch" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#FFF0EF"/><path d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9" stroke="#C64B45" stroke-width="2"/></pattern>
</defs><rect width="1600" height="1000" fill="#FFFFFF"/><path d="M40 40 H255 L40 255 Z" fill="#F4F1FB"/><path d="M1560 960 H1345 L1560 745 Z" fill="#F4F1FB"/><rect x="40" y="40" width="1520" height="920" rx="8" fill="none" stroke="#17324D" stroke-width="5"/><g font-family="Arial, Helvetica, sans-serif"><text x="800" y="110" text-anchor="middle" font-size="42" font-weight="700" fill="#17324D">Mountain campsite</text><text x="800" y="158" text-anchor="middle" font-size="27" fill="#40566D">Before and after a proposal for winter use</text><g transform="translate(80 180)" data-panel="before"><rect width="695" height="700" rx="10" fill="#FFFFFF" stroke="#A9B3BE" stroke-width="2"/><text x="347" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#17324D">BEFORE</text><rect x="70" y="95" width="555" height="500" rx="8" fill="#FBFAF7" stroke="#17324D" stroke-width="4"/><path d="M565 95 C530 170 600 245 562 325 C528 395 600 500 566 595" fill="none" stroke="#2F6F9F" stroke-width="22" data-fixed="stream"/><text x="538" y="245" transform="rotate(90 538 245)" font-size="17" font-weight="700" fill="#17324D">STREAM</text><path d="M90 112 H245 V200 H90 Z" fill="url(#green-dots)" stroke="#3F7D5A" stroke-width="3" data-fixed="tree-belt"/><text x="167" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">Tree belt</text><path d="M315 670 V595" stroke="#66788A" stroke-width="35" data-fixed="service-track"/><path d="M315 670 V595" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="12 9"/><text x="315" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#17324D">Service-track entrance</text><g aria-label="North arrow"><text x="605" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">N</text><line x1="605" y1="160" x2="605" y2="127" stroke="#17324D" stroke-width="3" marker-end="url(#arrow-navy)"/></g><g aria-label="Matched orientation, not to scale"><line x1="490" y1="558" x2="590" y2="558" stroke="#17324D" stroke-width="8"/><text x="540" y="585" text-anchor="middle" font-size="14" fill="#17324D">matched orientation • not to scale</text></g><rect x="110" y="465" width="150" height="92" fill="url(#orange-grid)" stroke="#17324D" stroke-width="3" data-feature="parking"/><text x="185" y="518" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Parking</text><ellipse cx="330" cy="340" rx="145" ry="105" fill="#EDF6EF" stroke="#3F7D5A" stroke-width="3" data-feature="tent-meadow"/><text x="330" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">Tent meadow</text><rect x="465" y="310" width="92" height="92" fill="url(#blue-lines)" stroke="#17324D" stroke-width="3" data-feature="wash-block"/><text x="511" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#17324D">Wash</text><text x="511" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#17324D">block</text><path d="M185 465 C225 420 240 395 275 375 M390 350 C420 350 435 350 465 350" fill="none" stroke="#C26B1D" stroke-width="10" stroke-dasharray="6 7" data-feature="footpath"/><text x="210" y="417" font-size="16" font-weight="700" fill="#17324D">Footpath</text></g><g transform="translate(825 180)" data-panel="after"><rect width="695" height="700" rx="10" fill="#FFFFFF" stroke="#A9B3BE" stroke-width="2"/><text x="347" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#17324D">PROPOSED WINTER USE</text><rect x="70" y="95" width="555" height="500" rx="8" fill="#FBFAF7" stroke="#17324D" stroke-width="4"/><path d="M565 95 C530 170 600 245 562 325 C528 395 600 500 566 595" fill="none" stroke="#2F6F9F" stroke-width="22" data-fixed="stream"/><text x="538" y="245" transform="rotate(90 538 245)" font-size="17" font-weight="700" fill="#17324D">STREAM</text><path d="M90 112 H245 V200 H90 Z" fill="url(#green-dots)" stroke="#3F7D5A" stroke-width="3" data-fixed="tree-belt"/><text x="167" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">Tree belt</text><path d="M315 670 V595" stroke="#66788A" stroke-width="35" data-fixed="service-track"/><path d="M315 670 V595" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="12 9"/><text x="315" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#17324D">Service-track entrance</text><g aria-label="North arrow"><text x="605" y="118" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">N</text><line x1="605" y1="160" x2="605" y2="127" stroke="#17324D" stroke-width="3" marker-end="url(#arrow-navy)"/></g><g aria-label="Matched orientation, not to scale"><line x1="490" y1="558" x2="590" y2="558" stroke="#17324D" stroke-width="8"/><text x="540" y="585" text-anchor="middle" font-size="14" fill="#17324D">matched orientation • not to scale</text></g><rect x="420" y="465" width="125" height="92" fill="url(#red-hatch)" stroke="#C64B45" stroke-width="3" data-feature="parking"/><text x="482" y="518" text-anchor="middle" font-size="19" font-weight="700" fill="#17324D">Parking</text><rect x="205" y="335" width="150" height="98" fill="url(#red-hatch)" stroke="#C64B45" stroke-width="3" data-feature="winter-hut"/><text x="280" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#17324D">Winter hut</text><ellipse cx="330" cy="250" rx="125" ry="58" fill="#EDF6EF" stroke="#3F7D5A" stroke-width="3" data-feature="reduced-tent-meadow"/><text x="330" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#17324D">Reduced tent meadow</text><text x="330" y="268" text-anchor="middle" font-size="15" fill="#17324D">north of winter hut</text><rect x="465" y="310" width="92" height="92" fill="url(#blue-lines)" stroke="#17324D" stroke-width="3" data-feature="retained-wash-block"/><text x="511" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#17324D">Retained</text><text x="511" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#17324D">wash block</text><rect x="105" y="465" width="125" height="92" fill="url(#blue-lines)" stroke="#2F6F9F" stroke-width="3" data-feature="snow-storage"/><text x="167" y="505" text-anchor="middle" font-size="17" font-weight="700" fill="#17324D">Snow</text><text x="167" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#17324D">storage</text><path d="M482 465 C445 435 390 400 355 386 M355 386 C400 375 430 360 465 355" fill="none" stroke="#C26B1D" stroke-width="13" stroke-dasharray="5 6" data-feature="boardwalk"/><path d="M315 595 C345 565 400 540 482 557" fill="none" stroke="#66788A" stroke-width="35"/><path d="M315 595 C345 565 400 540 482 557" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="12 9"/><text x="380" y="438" font-size="16" font-weight="700" fill="#17324D">Boardwalk</text></g><g aria-label="Legend"><rect x="420" y="905" width="32" height="22" fill="url(#orange-grid)" stroke="#17324D"/><text x="465" y="923" font-size="18" fill="#17324D">existing use</text><rect x="650" y="905" width="32" height="22" fill="url(#red-hatch)" stroke="#C64B45"/><text x="695" y="923" font-size="18" fill="#17324D">new or relocated</text><line x1="945" y1="916" x2="985" y2="916" stroke="#C26B1D" stroke-width="12" stroke-dasharray="5 6"/><text x="1000" y="923" font-size="18" fill="#17324D">boardwalk</text></g><text x="90" y="950" font-size="18" fill="#40566D">Source: author-created fictional campsite plan</text><text x="1510" y="950" text-anchor="end" font-size="20" font-weight="700" fill="#17324D">WeLearn Original Practice</text></g></svg>
