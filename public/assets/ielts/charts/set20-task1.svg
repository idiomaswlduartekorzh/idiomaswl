<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="system-ui,sans-serif">
  <rect width="680" height="400" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Annual Public Transport Journeys Per Capita — Selected Cities (2023)</text>

  <!-- Axes -->
  <line x1="100" y1="50" x2="100" y2="320" stroke="#374151" stroke-width="2"/>
  <line x1="100" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="2"/>

  <!-- Y-axis 0–500, 270px/500 = 0.54px per journey -->
  <text x="92" y="324" text-anchor="end" font-size="10" fill="#666">0</text>
  <text x="92" y="270" text-anchor="end" font-size="10" fill="#666">100</text>
  <text x="92" y="216" text-anchor="end" font-size="10" fill="#666">200</text>
  <text x="92" y="162" text-anchor="end" font-size="10" fill="#666">300</text>
  <text x="92" y="108" text-anchor="end" font-size="10" fill="#666">400</text>
  <text x="92" y="54"  text-anchor="end" font-size="10" fill="#666">500</text>

  <!-- Y gridlines -->
  <line x1="100" y1="270" x2="640" y2="270" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="216" x2="640" y2="216" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="162" x2="640" y2="162" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="108" x2="640" y2="108" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="100" y1="54"  x2="640" y2="54"  stroke="#e5e7eb" stroke-width="1"/>

  <!-- Scale: y = 320 - val*0.54 -->

  <!-- Tokyo: 465 → y = 320 - 251 = 69 -->
  <rect x="130" y="69" width="60" height="251" fill="#2563eb" rx="3"/>
  <text x="160" y="55" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="700">465</text>
  <text x="160" y="337" text-anchor="middle" font-size="10" fill="#374151">Tokyo</text>

  <!-- Singapore: 390 → y = 320 - 211 = 109 -->
  <rect x="234" y="109" width="60" height="211" fill="#16a34a" rx="3"/>
  <text x="264" y="95" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">390</text>
  <text x="264" y="337" text-anchor="middle" font-size="10" fill="#374151">Singapore</text>

  <!-- Berlin: 295 → y = 320 - 159 = 161 -->
  <rect x="338" y="161" width="60" height="159" fill="#f97316" rx="3"/>
  <text x="368" y="147" text-anchor="middle" font-size="10" fill="#f97316" font-weight="700">295</text>
  <text x="368" y="337" text-anchor="middle" font-size="10" fill="#374151">Berlin</text>

  <!-- São Paulo: 175 → y = 320 - 95 = 225 -->
  <rect x="442" y="225" width="60" height="95" fill="#7c3aed" rx="3"/>
  <text x="472" y="211" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="700">175</text>
  <text x="472" y="337" text-anchor="middle" font-size="10" fill="#374151">São Paulo</text>

  <!-- Los Angeles: 52 → y = 320 - 28 = 292 -->
  <rect x="546" y="292" width="60" height="28" fill="#dc2626" rx="3"/>
  <text x="576" y="278" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">52</text>
  <text x="576" y="337" text-anchor="middle" font-size="10" fill="#374151">Los Angeles</text>

  <!-- Y-axis title -->
  <text transform="rotate(-90)" x="-185" y="22" text-anchor="middle" font-size="11" fill="#374151">Journeys per capita per year</text>
</svg>
