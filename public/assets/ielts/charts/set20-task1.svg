<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Global electric-car sales and share of new-car sales, 2023 to 2025</title>
  <desc id="description">Two bar charts. Global electric-car sales rose from nearly 14 million in 2023 to more than 17 million in 2024 and 21 million in 2025. Their share of new-car sales rose from about 18 percent in 2023 to more than 20 percent in 2024 and 25 percent in 2025.</desc>
  <rect width="680" height="420" fill="#fafafa" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#172554">Global electric-car sales, 2023–2025</text>
  <text x="340" y="47" text-anchor="middle" font-size="10" fill="#475569">Electric cars include battery-electric and plug-in hybrid vehicles</text>

  <text x="184" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Sales (million cars)</text>
  <line x1="62" y1="92" x2="62" y2="316" stroke="#334155" stroke-width="2"/>
  <line x1="62" y1="316" x2="310" y2="316" stroke="#334155" stroke-width="2"/>
  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="54" y="320">0</text><text x="54" y="269">5</text><text x="54" y="218">10</text>
    <text x="54" y="167">15</text><text x="54" y="116">20</text><text x="54" y="96">22</text>
  </g>
  <g stroke="#dbe3ee" stroke-width="1">
    <line x1="62" y1="265" x2="310" y2="265"/><line x1="62" y1="214" x2="310" y2="214"/>
    <line x1="62" y1="163" x2="310" y2="163"/><line x1="62" y1="112" x2="310" y2="112"/>
  </g>
  <rect x="84" y="173" width="48" height="143" fill="#1d4ed8" rx="2"/>
  <rect x="160" y="142" width="48" height="174" fill="#1d4ed8" rx="2"/>
  <rect x="236" y="102" width="48" height="214" fill="#1d4ed8" rx="2"/>
  <g font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">
    <text x="108" y="164">≈14</text><text x="184" y="133">&gt;17</text><text x="260" y="93">21</text>
  </g>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="108" y="333">2023</text><text x="184" y="333">2024</text><text x="260" y="333">2025</text>
  </g>

  <text x="498" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Share of new-car sales</text>
  <line x1="374" y1="92" x2="374" y2="316" stroke="#334155" stroke-width="2"/>
  <line x1="374" y1="316" x2="622" y2="316" stroke="#334155" stroke-width="2"/>
  <g font-size="9" fill="#64748b" text-anchor="end">
    <text x="366" y="320">0%</text><text x="366" y="245">10%</text><text x="366" y="170">20%</text><text x="366" y="95">30%</text>
  </g>
  <g stroke="#dbe3ee" stroke-width="1">
    <line x1="374" y1="241" x2="622" y2="241"/><line x1="374" y1="166" x2="622" y2="166"/>
    <line x1="374" y1="92" x2="622" y2="92"/>
  </g>
  <rect x="396" y="181" width="48" height="135" fill="#c2410c" rx="2"/>
  <rect x="472" y="158" width="48" height="158" fill="#c2410c" rx="2"/>
  <rect x="548" y="128" width="48" height="188" fill="#c2410c" rx="2"/>
  <g font-size="10" font-weight="700" fill="#9a3412" text-anchor="middle">
    <text x="420" y="172">≈18%</text><text x="496" y="149">&gt;20%</text><text x="572" y="119">25%</text>
  </g>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="420" y="333">2023</text><text x="496" y="333">2024</text><text x="572" y="333">2025</text>
  </g>

  <text x="340" y="367" text-anchor="middle" font-size="9" fill="#64748b">Symbols ≈ and &gt; preserve the qualifications used in the source releases.</text>
  <text x="340" y="390" text-anchor="middle" font-size="9" fill="#64748b">Source: IEA, Global EV Outlook 2024–2026 and Global Energy Review 2026</text>
</svg>
