      - paragraph [ref=f2e33]: Processes require the passive voice and sequencing language. Convert each active step into the passive and choose the correct sequencer.
      - region "Official format versus WeLearn strategy" [ref=f2e34]:
        - article [ref=f2e35]:
          - heading "Official format versus WeLearn strategy" [level=2] [ref=f2e36]
          - paragraph [ref=f2e37]:
            - strong [ref=f2e38]: "Official format:"
            - text: IELTS Academic Writing Task 1 may ask you to describe a process as visual information. A process is a possible input, not a separate official section.
          - paragraph [ref=f2e39]:
            - strong [ref=f2e40]: "WeLearn strategy:"
            - text: We isolate processes because they require passive grammar, time order and no personal opinion.
        - article [ref=f2e41]:
          - heading "Answer review" [level=2] [ref=f2e42]
          - paragraph [ref=f2e43]:
            - strong [ref=f2e44]: "Review focus:"
            - text: Describe stages in logical order with the passive voice and clear sequencing.
          - paragraph [ref=f2e45]:
            - strong [ref=f2e46]: "Explained answer:"
            - text: A strong response groups stages, uses precise sequencers and avoids inventing causes that the diagram does not show.
