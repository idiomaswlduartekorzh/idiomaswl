      - heading "Process diagrams" [level=1] [ref=e32]
      - paragraph [ref=e33]: Processes require the passive voice and sequencing language. Convert each active step into the passive and choose the correct sequencer.
      - region "Official format versus WeLearn strategy" [ref=e34]:
        - article [ref=e35]:
          - heading "Official format versus WeLearn strategy" [level=2] [ref=e36]
          - paragraph [ref=e37]:
            - strong [ref=e38]: "Official format:"
            - text: IELTS Academic Writing Task 1 may ask you to describe a process as visual information. A process is a possible input, not a separate official section.
          - paragraph [ref=e39]:
            - strong [ref=e40]: "WeLearn strategy:"
            - text: We isolate processes because they require passive grammar, time order and no personal opinion.
        - article [ref=e41]:
          - heading "Answer review" [level=2] [ref=e42]
          - paragraph [ref=e43]:
            - strong [ref=e44]: "Review focus:"
            - text: Describe stages in logical order with the passive voice and clear sequencing.
          - paragraph [ref=e45]:
            - strong [ref=e46]: "Explained answer:"
            - text: A strong response groups stages, uses precise sequencers and avoids inventing causes that the diagram does not show.
